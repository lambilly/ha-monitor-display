title: 屏幕镜像

views:
  - title: 屏幕镜像
    path: screen-mirror
    type: panel
    icon: mdi:monitor-dashboard
    cards:
      - type: custom:html-template-card
        ignore_line_breaks: true
        content: |
          <style>

          :host,ha-card{margin:0 !important;padding:0 !important;border:none;box-shadow:none;background:transparent;width:100%}
          .hmd{width:min(100vw,430px);max-width:none;margin-left:calc(50% - min(50vw,215px));margin-right:calc(50% - min(50vw,215px));background:#0F0F0F;border-radius:0;box-sizing:border-box;
            padding:3px 6px 2px;display:flex;flex-direction:column;gap:5px;
            font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;color:#FFF;font-size:10px}
          .hmd *{box-sizing:border-box;min-width:0}
          .row{display:grid;gap:5px}
          .pgap{margin-top:19px}
          .pbot{margin-bottom:19px}
          .g2{grid-template-columns:1fr 1fr}
          .g3{grid-template-columns:1fr 1fr 1fr}
          .g4{grid-template-columns:repeat(4,1fr)}
          .g5{grid-template-columns:repeat(5,1fr)}
          .r1{grid-template-columns:41.5fr 24fr 34.5fr}
          .c{background:#1E1E1E;border-radius:10px;border:1px solid #FFF;display:flex;align-items:center;justify-content:flex-start;text-align:left;
            overflow:hidden;padding:0 10px;gap:1px}
          .c5{padding:0 5px;gap:2px}
          .c5 .m,.c5 .s{font-size:9px}
          .c5 ha-icon{display:block;align-self:center;line-height:0;margin:0;padding:0}
          /* 图标尺寸 = 所在文字字号（10px 基准，五格/风扇列 9px） */
          .hmd ha-icon{--mdc-icon-size:10px !important}
          /* 每页第一行（页首行）字号与图标 12px */
          .hd{font-size:12px}
          .hd .m,.hd .s,.hd span{font-size:12px}
          .hmd .hd ha-icon{--mdc-icon-size:12px !important}
          /* 家居页顶部屏幕控制 6 格：14px */
          .hc .m,.hc .s,.hc span{font-size:14px}
          .hmd .hc ha-icon{--mdc-icon-size:14px !important}
          .c5 ha-icon{--mdc-icon-size:9px !important}
          .c9{padding:0 8px;gap:1px}
          .c9 .m,.c9 .s{font-size:10px}
          .c9 .ln{padding:0 3px;gap:1px}
          .c9 ha-icon{--mdc-icon-size:10px !important}
          .col{flex-direction:column;align-items:stretch;padding:0;gap:0}
          .ln{display:flex;align-items:center;flex:1 1 0;min-height:19px;padding:0 4px 0 6px;gap:2px;min-width:0}
          .ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
          .m{font-size:10px}.s{font-size:10px}
          .ttl{font-size:10px;height:22px;display:flex;align-items:center;gap:3px;padding-left:8px;flex:none}
          .hr{height:1px;background:#FFF;opacity:.9;width:100px;margin:0 0 1px 5px;flex:none}
          .sec{font-size:10px;font-weight:600;color:#4FD8FA;padding:2px 4px 0 4px;display:flex;align-items:center;gap:5px}
          .tab{display:grid;grid-template-columns:repeat(4,1fr);height:49px;background:#1E1E1E;
            border-radius:10px;border:1px solid #FFF;align-items:center;margin-top:0}
          .ti{font-size:16px;text-align:center;color:#757575;line-height:1}
          .ti.on{color:#4FD8FA}
          .cq{background:#2A2A2A;border-radius:10px;border:1px solid #FFF;display:flex;align-items:center;justify-content:flex-start;text-align:left;overflow:hidden;padding:0 10px;gap:2px}
          .btn{justify-content:center;height:32px;white-space:nowrap}
          </style>
          {# 通知图标映射：NR 把 emoji 换成「#RRGGBB <MDI码点>#」内联色标（屏幕端 LVGL 解析），
             网页端不认这个语法会显示成编码 → 这里按「颜色+码点」还原成 ha-icon。 #}
          {% set NIM = {'#4FD8FA \U000F001B#':'<ha-icon icon="mdi:air-conditioner" style="--mdc-icon-size:13px;color:#4FD8FA;vertical-align:-2px"></ha-icon>','#4FD8FA \U000F0290#':'<ha-icon icon="mdi:fridge" style="--mdc-icon-size:13px;color:#4FD8FA;vertical-align:-2px"></ha-icon>','#4FD8FA \U000F070D#':'<ha-icon icon="mdi:robot-vacuum" style="--mdc-icon-size:13px;color:#4FD8FA;vertical-align:-2px"></ha-icon>','#59D98B \U000F0079#':'<ha-icon icon="mdi:battery" style="--mdc-icon-size:13px;color:#59D98B;vertical-align:-2px"></ha-icon>','#59D98B \U000F0114#':'<ha-icon icon="mdi:cash" style="--mdc-icon-size:13px;color:#59D98B;vertical-align:-2px"></ha-icon>','#59D98B \U000F0210#':'<ha-icon icon="mdi:fan" style="--mdc-icon-size:13px;color:#59D98B;vertical-align:-2px"></ha-icon>','#59D98B \U000F034E#':'<ha-icon icon="mdi:map-marker" style="--mdc-icon-size:13px;color:#59D98B;vertical-align:-2px"></ha-icon>','#59D98B \U000F0584#':'<ha-icon icon="mdi:wallet" style="--mdc-icon-size:13px;color:#59D98B;vertical-align:-2px"></ha-icon>','#59D98B \U000F0595#':'<ha-icon icon="mdi:weather-partly-cloudy" style="--mdc-icon-size:13px;color:#59D98B;vertical-align:-2px"></ha-icon>','#59D98B \U000F059D#':'<ha-icon icon="mdi:weather-windy" style="--mdc-icon-size:13px;color:#59D98B;vertical-align:-2px"></ha-icon>','#59D98B \U000F05A9#':'<ha-icon icon="mdi:wifi" style="--mdc-icon-size:13px;color:#59D98B;vertical-align:-2px"></ha-icon>','#59D98B \U000F05E0#':'<ha-icon icon="mdi:check-circle" style="--mdc-icon-size:13px;color:#59D98B;vertical-align:-2px"></ha-icon>','#59D98B \U000F0928#':'<ha-icon icon="mdi:wifi-strength-4" style="--mdc-icon-size:13px;color:#59D98B;vertical-align:-2px"></ha-icon>','#59D98B \U000F0D43#':'<ha-icon icon="mdi:air-filter" style="--mdc-icon-size:13px;color:#59D98B;vertical-align:-2px"></ha-icon>','#5AA9FF ●#':'<span style="color:#5AA9FF">&#9679;</span>','#5AA9FF \U000F0004#':'<ha-icon icon="mdi:account" style="--mdc-icon-size:13px;color:#5AA9FF;vertical-align:-2px"></ha-icon>','#5AA9FF \U000F00ED#':'<ha-icon icon="mdi:calendar" style="--mdc-icon-size:13px;color:#5AA9FF;vertical-align:-2px"></ha-icon>','#5AA9FF \U000F010B#':'<ha-icon icon="mdi:car" style="--mdc-icon-size:13px;color:#5AA9FF;vertical-align:-2px"></ha-icon>','#5AA9FF \U000F011C#':'<ha-icon icon="mdi:cellphone" style="--mdc-icon-size:13px;color:#5AA9FF;vertical-align:-2px"></ha-icon>','#5AA9FF \U000F0150#':'<ha-icon icon="mdi:clock-outline" style="--mdc-icon-size:13px;color:#5AA9FF;vertical-align:-2px"></ha-icon>','#5AA9FF \U000F02DC#':'<ha-icon icon="mdi:home" style="--mdc-icon-size:13px;color:#5AA9FF;vertical-align:-2px"></ha-icon>','#5AA9FF \U000F0369#':'<ha-icon icon="mdi:message-text" style="--mdc-icon-size:13px;color:#5AA9FF;vertical-align:-2px"></ha-icon>','#5AA9FF \U000F04B9#':'<ha-icon icon="mdi:sofa" style="--mdc-icon-size:13px;color:#5AA9FF;vertical-align:-2px"></ha-icon>','#5AA9FF \U000F04DC#':'<ha-icon icon="mdi:store" style="--mdc-icon-size:13px;color:#5AA9FF;vertical-align:-2px"></ha-icon>','#5AA9FF \U000F058C#':'<ha-icon icon="mdi:water" style="--mdc-icon-size:13px;color:#5AA9FF;vertical-align:-2px"></ha-icon>','#5AA9FF \U000F058E#':'<ha-icon icon="mdi:water-percent" style="--mdc-icon-size:13px;color:#5AA9FF;vertical-align:-2px"></ha-icon>','#5AA9FF \U000F0597#':'<ha-icon icon="mdi:weather-rainy" style="--mdc-icon-size:13px;color:#5AA9FF;vertical-align:-2px"></ha-icon>','#5AA9FF \U000F072A#':'<ha-icon icon="mdi:washing-machine" style="--mdc-icon-size:13px;color:#5AA9FF;vertical-align:-2px"></ha-icon>','#5AA9FF \U000F09A0#':'<ha-icon icon="mdi:shower" style="--mdc-icon-size:13px;color:#5AA9FF;vertical-align:-2px"></ha-icon>','#5AA9FF \U000F0F92#':'<ha-icon icon="mdi:water-boiler" style="--mdc-icon-size:13px;color:#5AA9FF;vertical-align:-2px"></ha-icon>','#757575 ●#':'<span style="color:#757575">&#9679;</span>','#757575 \U000F0004#':'<ha-icon icon="mdi:account" style="--mdc-icon-size:13px;color:#757575;vertical-align:-2px"></ha-icon>','#757575 \U000F00B5#':'<ha-icon icon="mdi:blur" style="--mdc-icon-size:13px;color:#757575;vertical-align:-2px"></ha-icon>','#757575 \U000F0590#':'<ha-icon icon="mdi:weather-cloudy" style="--mdc-icon-size:13px;color:#757575;vertical-align:-2px"></ha-icon>','#757575 \U000F07E4#':'<ha-icon icon="mdi:molecule-co2" style="--mdc-icon-size:13px;color:#757575;vertical-align:-2px"></ha-icon>','#B39DFF \U000F000E#':'<ha-icon icon="mdi:account-multiple" style="--mdc-icon-size:13px;color:#B39DFF;vertical-align:-2px"></ha-icon>','#B39DFF \U000F029A#':'<ha-icon icon="mdi:gauge" style="--mdc-icon-size:13px;color:#B39DFF;vertical-align:-2px"></ha-icon>','#B39DFF \U000F02E3#':'<ha-icon icon="mdi:bed" style="--mdc-icon-size:13px;color:#B39DFF;vertical-align:-2px"></ha-icon>','#B39DFF \U000F0369#':'<ha-icon icon="mdi:message-text" style="--mdc-icon-size:13px;color:#B39DFF;vertical-align:-2px"></ha-icon>','#B39DFF \U000F04C3#':'<ha-icon icon="mdi:speaker" style="--mdc-icon-size:13px;color:#B39DFF;vertical-align:-2px"></ha-icon>','#B39DFF \U000F0594#':'<ha-icon icon="mdi:weather-night" style="--mdc-icon-size:13px;color:#B39DFF;vertical-align:-2px"></ha-icon>','#B39DFF \U000F0FEF#':'<ha-icon icon="mdi:credit-card" style="--mdc-icon-size:13px;color:#B39DFF;vertical-align:-2px"></ha-icon>','#FF5252 ●#':'<span style="color:#FF5252">&#9679;</span>','#FF5252 \U000F0026#':'<ha-icon icon="mdi:alert" style="--mdc-icon-size:13px;color:#FF5252;vertical-align:-2px"></ha-icon>','#FF5252 \U000F0159#':'<ha-icon icon="mdi:close-circle" style="--mdc-icon-size:13px;color:#FF5252;vertical-align:-2px"></ha-icon>','#FF5252 \U000F0238#':'<ha-icon icon="mdi:fire" style="--mdc-icon-size:13px;color:#FF5252;vertical-align:-2px"></ha-icon>','#FF5252 \U000F02D1#':'<ha-icon icon="mdi:heart" style="--mdc-icon-size:13px;color:#FF5252;vertical-align:-2px"></ha-icon>','#FF5252 \U000F0438#':'<ha-icon icon="mdi:radiator" style="--mdc-icon-size:13px;color:#FF5252;vertical-align:-2px"></ha-icon>','#FFB74D ●#':'<span style="color:#FFB74D">&#9679;</span>','#FFB74D \U000F0176#':'<ha-icon icon="mdi:coffee" style="--mdc-icon-size:13px;color:#FFB74D;vertical-align:-2px"></ha-icon>','#FFB74D \U000F04B9#':'<ha-icon icon="mdi:sofa" style="--mdc-icon-size:13px;color:#FFB74D;vertical-align:-2px"></ha-icon>','#FFB74D \U000F050F#':'<ha-icon icon="mdi:thermometer" style="--mdc-icon-size:13px;color:#FFB74D;vertical-align:-2px"></ha-icon>','#FFB74D \U000F0F54#':'<ha-icon icon="mdi:home-thermometer" style="--mdc-icon-size:13px;color:#FFB74D;vertical-align:-2px"></ha-icon>','#FFD54F \U000F0026#':'<ha-icon icon="mdi:alert" style="--mdc-icon-size:13px;color:#FFD54F;vertical-align:-2px"></ha-icon>','#FFD54F \U000F009A#':'<ha-icon icon="mdi:bell" style="--mdc-icon-size:13px;color:#FFD54F;vertical-align:-2px"></ha-icon>','#FFD54F \U000F0241#':'<ha-icon icon="mdi:flash" style="--mdc-icon-size:13px;color:#FFD54F;vertical-align:-2px"></ha-icon>','#FFD54F \U000F0335#':'<ha-icon icon="mdi:lightbulb" style="--mdc-icon-size:13px;color:#FFD54F;vertical-align:-2px"></ha-icon>','#FFD54F \U000F0369#':'<ha-icon icon="mdi:message-text" style="--mdc-icon-size:13px;color:#FFD54F;vertical-align:-2px"></ha-icon>','#FFD54F \U000F04CE#':'<ha-icon icon="mdi:star" style="--mdc-icon-size:13px;color:#FFD54F;vertical-align:-2px"></ha-icon>','#FFD54F \U000F0599#':'<ha-icon icon="mdi:weather-sunny" style="--mdc-icon-size:13px;color:#FFD54F;vertical-align:-2px"></ha-icon>','#FFD54F \U000F05A8#':'<ha-icon icon="mdi:white-balance-sunny" style="--mdc-icon-size:13px;color:#FFD54F;vertical-align:-2px"></ha-icon>','#FFD54F \U000F0A72#':'<ha-icon icon="mdi:solar-power" style="--mdc-icon-size:13px;color:#FFD54F;vertical-align:-2px"></ha-icon>','#FFFFFF ●#':'<span style="color:#FFFFFF">&#9679;</span>'} %}
          <div class="hmd">
          <!-- 屏幕控制 3+3（14px）：亮屏 | 屏显 | 屏幕 ／ 休眠 | 亮度 | 超时 -->
          {% set hcells = [
              {'t':'sw','eid':'switch.hmd_remote_notify_wake','ic':'bell-ring','nm':'亮屏','col':'#59D98B'},
              {'t':'sw','eid':'light.hmd_remote_screen_power','ic':'monitor','nm':'屏显','col':'#FFB74D'},
              {'t':'conn'},
              {'t':'sw','eid':'switch.hmd_remote_auto_sleep','ic':'sleep','nm':'休眠','col':'#5AA9FF'},
              {'t':'num','eid':'number.hmd_remote_brightness','ic':'brightness-6','nm':'亮度','col':'#FFD54F'},
              {'t':'sec','eid':'number.hmd_remote_sleep_timeout','ic':'timer-sand','nm':'超时','col':'#B39DFF'}] %}
          {% for grp in [hcells[:3], hcells[3:]] %}
          <div class="row g3">
            {% for it in grp %}
            {% if it.t == 'conn' %}
            {% set online = is_state('binary_sensor.hmd_screen_online','on') %}
            {% set cc = '#59D98B' if online else '#FF5252' %}
            <div class="c hc" style="height:44px">
              <ha-icon icon="mdi:{{ 'monitor' if online else 'cloud-off-outline' }}" style="color:{{ cc }};flex:none"></ha-icon>
              <span class="m ell">屏幕: <span style="color:{{ cc }}">{{ '在线' if online else '离线' }}</span></span>
            </div>
            {% else %}
            {% set sv = states(it.eid) %}
            {% if it.t == 'sw' %}
              {% set ok = sv in ['on','off'] %}
              {% set txt = '开' if sv == 'on' else ('关' if sv == 'off' else '--') %}
              {% set lit = sv == 'on' %}
            {% elif it.t == 'sec' %}
              {% set n = sv | int(-1) %}
              {% set ok = n >= 0 %}
              {% set txt = '--' if n < 0 else (((n // 60) ~ '分') if (n >= 60 and n % 60 == 0) else (n ~ '秒')) %}
              {% set lit = true %}
            {% else %}
              {% set n = sv | int(-1) %}
              {% set ok = n >= 0 %}
              {% set txt = '--' if n < 0 else ((n | string) ~ '%') %}
              {% set lit = true %}
            {% endif %}
            <div class="c hc" style="height:44px">
              <ha-icon icon="mdi:{{ it.ic }}" style="color:{{ it.col }};flex:none"></ha-icon>
              <span class="m ell">{{ it.nm }}: <span style="color:{% if not ok or not lit %}#757575{% else %}{{ it.col }}{% endif %}">{{ txt }}</span></span>
            </div>
            {% endif %}
            {% endfor %}
          </div>
          {% endfor %}

          <!-- 行1 y5 h50：中文时间 | 天气 | 上证（涨红/跌绿/平白，三件套同步变色） -->
          <div class="c hd pgap" style="height:50px;gap:4px;justify-content:space-between">
            <span class="m ell" style="min-width:0">{{ states('sensor.zhong_wen_shi_jian') }}</span>
            <div style="display:flex;align-items:center;gap:4px;flex:none">
              <ha-icon icon="mdi:weather-partly-cloudy" style="--mdc-icon-size:16px;color:#4FD8FA;flex:none"></ha-icon>
              {% set wc = states('weather.tian_qi') %}
              {% set wmap = {'clear-night':'晴夜','cloudy':'多云','exceptional':'极端','fog':'雾','hail':'冰雹','lightning':'雷雨','lightning-rainy':'雷阵雨','partlycloudy':'多云','pouring':'暴雨','rainy':'雨','snowy':'雪','snowy-rainy':'雨夹雪','sunny':'晴','windy':'大风','windy-variant':'大风'} %}
              {% set cn = wmap.get(wc) %}
              <span class="m ell" style="flex:none">{% if cn %}{{ cn }}{% else %}<span style="color:#757575">--</span>{% endif %} {{ state_attr('weather.tian_qi','temperature') | float(0) | round(0) | int }}℃</span>
            </div>
            {% set s = state_attr('sensor.mei_ri_gu_zhi','sh000001') %}
            {% set ok = s is mapping and s.price is defined and s.changeRatio is defined %}
            {% set cr = (s.changeRatio | float(0)) if ok else 0 %}
            <div style="display:flex;align-items:center;gap:4px;min-width:0;color:{% if not ok %}#757575{% elif cr > 0 %}#FF5252{% elif cr < 0 %}#59D98B{% else %}#FFF{% endif %}">
              <ha-icon icon="mdi:chart-line" style="--mdc-icon-size:16px;flex:none"></ha-icon>
              <span class="m ell">上证: {{ '%.2f' | format(s.price | float(0)) if ok else '--' }}</span>
            </div>
          </div>

          <!-- 行2 y61 h41：四格一行（在家橙/客人紫/手机蓝/语音绿，图标恒基色，数值>0基色/否则灰） -->
          <div class="row g4">
            {% for cell in [
                {'eid':'sensor.family_home_count','ic':'home-account','nm':'在家','col':'#FFB74D'},
                {'eid':'sensor.guest_visit_count','ic':'account-multiple','nm':'客人','col':'#B39DFF'},
                {'eid':'sensor.phone_online_count','ic':'cellphone','nm':'手机','col':'#5AA9FF'}] %}
            {% set n = states(cell.eid) | int(-1) %}
            <div class="c" style="height:41px">
              <ha-icon icon="mdi:{{ cell.ic }}" style="--mdc-icon-size:16px;color:{{ cell.col }};flex:none"></ha-icon>
              <span class="m ell">{{ cell.nm }}: {% if n < 0 %}<span style="color:#757575">--</span>{% else %}<span style="color:{{ cell.col if n > 0 else '#757575' }}">{{ n }}</span>{% endif %}</span>
            </div>
            {% endfor %}
            {% set vb = states('switch.voice_broadcast') %}
            <div class="c" style="height:41px">
              <ha-icon icon="mdi:microphone" style="--mdc-icon-size:16px;color:#59D98B;flex:none"></ha-icon>
              <span class="m ell">语音: {% if vb not in ['on','off'] %}<span style="color:#757575">--</span>{% else %}<span style="color:{{ '#59D98B' if vb == 'on' else '#FF5252' }}">{{ '开' if vb == 'on' else '关' }}</span>{% endif %}</span>
            </div>
          </div>

          <!-- 行3 y110 h49：居家模式（在家橙/离家红/休息紫/影音黄）| 车位状态（空闲绿/轩逸黄/比亚迪粉） -->
          <div class="row g2">
            <div class="c" style="height:49px;gap:5px">
              {% set ms = states('sensor.ju_jia_mo_shi') %}
              <ha-icon icon="mdi:home-heart" style="--mdc-icon-size:16px;color:{% if '在家' in ms %}#FFB74D{% elif '离家' in ms %}#FF5252{% elif '休息' in ms %}#B39DFF{% elif '影音' in ms %}#FFD54F{% else %}#FFF{% endif %};flex:none"></ha-icon>
              <span class="m ell">{{ ms if ms not in ['unknown','unavailable',''] else '居家模式' }}</span>
              {% set p = state_attr('sensor.ju_jia_mo_shi','volume_percent') %}
              {% if p %}<span class="s" style="color:#5AA9FF;flex:none">{{ p }}</span>{% endif %}
              {% set act = states('sensor.huo_dong_gui_ji') %}
              {% set has_act = act not in ['unknown','unavailable',''] %}
              <span class="s ell" style="color:{% if has_act %}#FFF{% else %}#757575{% endif %}">{{ act if has_act else '--' }}</span>
            </div>
            <div class="c" style="height:49px;gap:5px">
              <ha-icon icon="mdi:car" style="--mdc-icon-size:16px;color:#FFB74D;flex:none"></ha-icon>
              {% set pk = states('sensor.parking_status') %}
              <span class="m ell">车位状态: {% if pk in ['unknown','unavailable',''] %}<span style="color:#757575">--</span>{% else %}<span style="color:{% if '空闲' in pk %}#59D98B{% elif '比亚迪' in pk %}#FF80AB{% elif '轩逸' in pk %}#FFD54F{% else %}#FFF{% endif %}">{{ pk }}</span>{% endif %}</span>
              <div style="display:flex;flex-direction:column;gap:0;align-items:flex-start;min-width:0;margin-left:auto">
                {% set xy = states('sensor.wo_de_jia_xuan_yi_distance') | float(-1) %}
                {% set by = states('sensor.wo_de_jia_bi_ya_di_distance') | float(-1) %}
                <span class="s ell" style="line-height:14px;color:{% if xy >= 0 %}#FFD54F{% else %}#757575{% endif %}">{{ '%.2fkm' | format(xy) if xy >= 0 else '--' }}</span>
                <span class="s ell" style="line-height:14px;color:{% if by >= 0 %}#FF80AB{% else %}#757575{% endif %}">{{ '%.2fkm' | format(by) if by >= 0 else '--' }}</span>
              </div>
            </div>
          </div>

          <!-- 列区 y162 h101：电器动态 | 今日能耗 | 右列 Nova13/Nova12 -->
          <div class="row g3">
            <div class="c col" style="height:101px">
              <div class="ttl"><ha-icon icon="mdi:lightbulb-group" style="--mdc-icon-size:16px;color:#4FD8FA"></ha-icon><span>电器动态</span></div>
              <div class="hr"></div>
              {% for it in [
                  {'eid':'sensor.light_on_count','ic':'lightbulb-group','nm':'电灯','tot':'36盏','col':'#FFB74D'},
                  {'eid':'sensor.curtain_closed_count','ic':'curtains','nm':'窗帘','tot':'6幅','col':'#B39DFF'},
                  {'eid':'sensor.climate_on_count','ic':'air-conditioner','nm':'空调','tot':'4台','col':'#59D98B'},
                  {'eid':'sensor.equipment_on_count','ic':'power-plug','nm':'电器','tot':'20台','col':'#5AA9FF'}] %}
              {% set v = states(it.eid) | int(-1) %}
              <div class="ln"><ha-icon icon="mdi:{{ it.ic }}" style="--mdc-icon-size:16px;color:{{ it.col }};flex:none"></ha-icon><span class="s ell">{{ it.nm }}: {% if v < 0 %}<span style="color:#757575">--</span>{% else %}{{ v }}/{{ it.tot }}{% endif %}</span></div>
              {% endfor %}
            </div>
            <div class="c col" style="height:101px">
              <div class="ttl"><ha-icon icon="mdi:lightning-bolt" style="--mdc-icon-size:16px;color:#4FD8FA"></ha-icon><span>今日能耗</span></div>
              <div class="hr"></div>
              <div class="ln"><ha-icon icon="mdi:flash" style="--mdc-icon-size:16px;color:#FFB74D;flex:none"></ha-icon><span class="s ell">电压: {{ states('sensor.tasmota_energy_voltage') }}V</span></div>
              <div class="ln"><ha-icon icon="mdi:water" style="--mdc-icon-size:16px;color:#B39DFF;flex:none"></ha-icon><span class="s ell">水压: {{ (states('sensor.maze_wateronev3_tp_f8e644') | float(0) / 1000) | round(2) }}kPa</span></div>
              <div class="ln"><ha-icon icon="mdi:fire" style="--mdc-icon-size:16px;color:#59D98B;flex:none"></ha-icon><span class="s ell">用气: {{ states('sensor.ri_yong_qi_liang') }}</span></div>
              <div class="ln"><ha-icon icon="mdi:chart-bar" style="--mdc-icon-size:16px;color:#5AA9FF;flex:none"></ha-icon><span class="s ell">用电: {{ states('sensor.tasmota_energy_today') }}kWh</span></div>
            </div>
            <div style="display:flex;flex-direction:column;gap:5px;min-width:0">
              <div class="c" style="height:49px;gap:3px">
                <ha-icon icon="mdi:cellphone-screenshot" style="--mdc-icon-size:16px;color:#7BC8FF;flex:none"></ha-icon>
                <span class="m ell">Nova13</span>

                {% set ds = states('binary_sensor.lam_nova13') %}<span class="m ell" style="color:{{ '#59D98B' if ds == 'on' else '#757575' }}">{{ '在线' if ds == 'on' else ('离线' if ds == 'off' else '--') }}</span>
              </div>
              <div class="c" style="height:49px;gap:3px">
                <ha-icon icon="mdi:cellphone" style="--mdc-icon-size:16px;color:#B39DFF;flex:none"></ha-icon>
                <span class="m ell">Nova12</span>

                {% set ds = states('binary_sensor.su_nova12') %}<span class="m ell" style="color:{{ '#59D98B' if ds == 'on' else '#757575' }}">{{ '在线' if ds == 'on' else ('离线' if ds == 'off' else '--') }}</span>
              </div>
            </div>
          </div>

          <div class="tab">
            <div class="ti on">家居</div>
            <div class="ti">网络</div>
            <div class="ti">系统</div>
            <div class="ti">通知</div>
          </div>
          <!-- 行1 y5 h50：外网IP | 已连接时长 -->
          <div class="c hd pgap" style="height:50px;gap:4px">
            <ha-icon icon="mdi:earth" style="--mdc-icon-size:16px;color:#4FD8FA;flex:none"></ha-icon>
            <span class="m ell">外网IP: {{ states('sensor.tp_link_smb_tl_r498gpm_ac_external_ip') }}</span>
            <ha-icon icon="mdi:clock-outline" style="--mdc-icon-size:16px;color:#59D98B;flex:none;margin-left:auto"></ha-icon>
            {% set u = states('sensor.tp_link_smb_tl_r498gpm_ac_uptime') | int(0) %}
            <span class="m ell" style="flex:none">已连接: {{ '%d天%d小时' | format(u // 86400, (u % 86400) // 3600) }}</span>
          </div>

          <!-- 行2 y61 h41：五格一行，整格同色（>0基色 主机红/网关紫/无线橙/设备蓝/语音绿；=0红；无数据灰） -->
          <div class="row g5">
            {% for cell in [
                {'eid':'sensor.server_online_count','ic':'server-network','nm':'主机','col':'#FF5252'},
                {'eid':'sensor.gateway_online_count','ic':'router-network','nm':'网关','col':'#B39DFF'},
                {'eid':'sensor.ap_online_count','ic':'wifi','nm':'无线','col':'#FFB74D'},
                {'eid':'sensor.device_monitor_count','ic':'devices','nm':'设备','col':'#5AA9FF'},
                {'eid':'sensor.asr_online_count','ic':'microphone-message','nm':'语音','col':'#59D98B'}] %}
            {% set n = states(cell.eid) | int(-1) %}
            <div class="c c5" style="height:41px;color:{% if n < 0 %}#757575{% elif n > 0 %}{{ cell.col }}{% else %}#FF5252{% endif %}">
              <ha-icon icon="mdi:{{ cell.ic }}" style="--mdc-icon-size:12px;flex:none"></ha-icon>
              <span class="s ell">{{ cell.nm }}: {{ '--' if n < 0 else n }}</span>
            </div>
            {% endfor %}
          </div>

          <!-- 三列 y110 h153：网络运行 | NAS运行 | 风扇运行 -->
          <div class="row g3">
            <div class="c col" style="height:153px">
              <div class="ttl"><ha-icon icon="mdi:lan-connect" style="--mdc-icon-size:16px;color:#4FD8FA"></ha-icon><span>网络运行</span></div>
              <div class="hr"></div>
              {% for it in [
                  {'eid':'sensor.router_online_count','ic':'router','nm':'路由在线','u':'台','col':'#FFB74D'},
                  {'eid':'sensor.device_control_count','ic':'remote','nm':'控制设备','u':'个','col':'#B39DFF'},
                  {'eid':'sensor.terminal_online_count','ic':'laptop','nm':'终端在线','u':'个','col':'#59D98B'}] %}
              {% set v = states(it.eid) | int(-1) %}
              <div class="ln"><ha-icon icon="mdi:{{ it.ic }}" style="--mdc-icon-size:16px;color:{{ it.col }};flex:none"></ha-icon><span class="s ell">{{ it.nm }}: {% if v < 0 %}<span style="color:#757575">--</span>{% else %}{{ v }}{{ it.u }}{% endif %}</span></div>
              {% endfor %}
              {% set lb = states('sensor.low_battery_count') | int(-1) %}
              <div class="ln"><ha-icon icon="mdi:battery-alert" style="--mdc-icon-size:16px;color:#5AA9FF;flex:none"></ha-icon><span class="s ell">低电量数: {% if lb < 0 %}<span style="color:#757575">--</span>{% elif lb > 0 %}<span style="color:#FF5252">{{ lb }}个</span>{% else %}{{ lb }}个{% endif %}</span></div>
            </div>
            <div class="c col" style="height:153px">
              <div class="ttl"><ha-icon icon="mdi:nas" style="--mdc-icon-size:16px;color:#4FD8FA"></ha-icon><span>NAS运行</span></div>
              <div class="hr"></div>
              {% set cpu = states('sensor.lamnas_ws_cpu_utilization_total') | float(-1) %}
              <div class="ln"><ha-icon icon="mdi:cpu-64-bit" style="--mdc-icon-size:16px;color:#FFB74D;flex:none"></ha-icon><span class="s ell">CPU利用: {% if cpu < 0 %}<span style="color:#757575">--</span>{% else %}<span style="color:{% if cpu >= 90 %}#FF5252{% elif cpu >= 70 %}#FFD54F{% else %}#FFF{% endif %}">{{ cpu | round(0) | int }}%</span>{% endif %}</span></div>
              {% set mem = states('sensor.lamnas_ws_memory_usage_real') | float(-1) %}
              <div class="ln"><ha-icon icon="mdi:memory" style="--mdc-icon-size:16px;color:#B39DFF;flex:none"></ha-icon><span class="s ell">内存可用: {% if mem < 0 %}<span style="color:#757575">--</span>{% else %}<span style="color:{% if mem >= 92 %}#FF5252{% elif mem >= 75 %}#FFD54F{% else %}#FFF{% endif %}">{{ mem | round(0) | int }}%</span>{% endif %}</span></div>
              {% set up = states('sensor.lamnas_ws_upload_throughput') | int(-1) %}
              <div class="ln"><ha-icon icon="mdi:upload" style="--mdc-icon-size:16px;color:#59D98B;flex:none"></ha-icon><span class="s ell">上传: {% if up < 0 %}<span style="color:#757575">--</span>{% elif up >= 1048576 %}{{ (up / 1048576) | round(2) }} MB/s{% elif up >= 1024 %}{{ (up / 1024) | round(1) }} KB/s{% else %}{{ up }} B/s{% endif %}</span></div>
              {% set dn = states('sensor.lamnas_ws_download_throughput') | int(-1) %}
              <div class="ln"><ha-icon icon="mdi:download" style="--mdc-icon-size:16px;color:#5AA9FF;flex:none"></ha-icon><span class="s ell">下载: {% if dn < 0 %}<span style="color:#757575">--</span>{% elif dn >= 1048576 %}{{ (dn / 1048576) | round(2) }} MB/s{% elif dn >= 1024 %}{{ (dn / 1024) | round(1) }} KB/s{% else %}{{ dn }} B/s{% endif %}</span></div>
            </div>
            <div class="c c9 col" style="height:153px">
              <div class="ttl"><ha-icon icon="mdi:fan" style="--mdc-icon-size:16px;color:#4FD8FA"></ha-icon><span>风扇运行</span></div>
              <div class="hr"></div>
              {% for f in [
                  {'eid':'fan.fan_pwm_controller_fan_1','ic':'fan','nm':'前扇','col':'#FFB74D','t':'sensor.fan_pwm_controller_temperature','tc':'#FF5252'},
                  {'eid':'fan.fan_pwm_controller_fan_2','ic':'fan','nm':'后扇','col':'#B39DFF','t':'sensor.miaomiaoc_cn_blt_3_1f33gjhbc4k00_t2_temperature_p_2_1','tc':'#FFB74D'}] %}
              {% set p = state_attr(f.eid,'percentage') | int(0) %}
              <div class="ln"><ha-icon icon="mdi:{{ f.ic }}" style="--mdc-icon-size:15px;color:{{ f.col }};flex:none"></ha-icon><span class="s ell">{{ f.nm }}:</span><ha-icon icon="mdi:fan" style="--mdc-icon-size:11px;flex:none;color:{% if is_state(f.eid,'off') %}#757575{% else %}{% if p > 80 %}#FF5252{% elif p > 50 %}#FFB74D{% else %}#59D98B{% endif %}{% endif %}"></ha-icon><span class="s ell" style="color:{% if is_state(f.eid,'off') %}#757575{% else %}{% if p > 80 %}#FF5252{% elif p > 50 %}#FFB74D{% else %}#59D98B{% endif %}{% endif %}">{% if is_state(f.eid,'off') %}停{% else %}{{ p }}%{% endif %}</span>{% set tv = states(f.t) | float(-999) %}<span class="s ell" style="flex:none;margin-left:3px;color:{% if tv > -999 %}#FFF{% else %}#757575{% endif %}">{% if tv > -999 %}{{ tv | round(0) | int }}℃{% else %}--{% endif %}</span></div>
              {% endfor %}
              {% for sw in [
                  {'eid':'switch.ruo_dian_xiang_feng_shan_sonoff_1002b4248d_1','ic':'fan-chevron-down','nm':'进扇','col':'#59D98B','t':'sensor.miaomiaoc_cn_blt_3_1f308atcc4o01_t2_temperature_p_2_1','tc':'#FFD54F'},
                  {'eid':'switch.ruo_dian_xiang_feng_shan_sonoff_1002b4248d_2','ic':'fan-chevron-up','nm':'出扇','col':'#5AA9FF','t':'sensor.miaomiaoc_cn_blt_3_1fpsendsc4g01_t2_temperature_p_2_1','tc':'#59D98B'}] %}
              <div class="ln"><ha-icon icon="mdi:{{ sw.ic }}" style="--mdc-icon-size:15px;color:{{ sw.col }};flex:none"></ha-icon><span class="s ell">{{ sw.nm }}:</span><ha-icon icon="mdi:fan" style="--mdc-icon-size:11px;flex:none;color:{{ '#59D98B' if is_state(sw.eid,'on') else '#757575' }}"></ha-icon><span class="s ell" style="color:{{ '#59D98B' if is_state(sw.eid,'on') else '#757575' }}">{{ '开' if is_state(sw.eid,'on') else '关' }}</span>{% set tv = states(sw.t) | float(-999) %}<span class="s ell" style="flex:none;margin-left:3px;color:{% if tv > -999 %}#FFF{% else %}#757575{% endif %}">{% if tv > -999 %}{{ tv | round(0) | int }}℃{% else %}--{% endif %}</span></div>
              {% endfor %}
            </div>
          </div>

          <div class="tab">
            <div class="ti">家居</div>
            <div class="ti on">网络</div>
            <div class="ti">系统</div>
            <div class="ti">通知</div>
          </div>
          <!-- 行1 y5 h50：系统状态 | 运行时长（屏幕自身 uptime） -->
          <div class="c hd pgap" style="height:50px;gap:4px">
            <ha-icon icon="mdi:monitor-dashboard" style="--mdc-icon-size:16px;color:#4FD8FA;flex:none"></ha-icon>
            <span class="m ell">系统状态</span>
            <ha-icon icon="mdi:timer-outline" style="--mdc-icon-size:16px;color:#59D98B;flex:none;margin-left:auto"></ha-icon>
            {% set up = states('sensor.ha_monitor_display_uptime') | float(0) %}
            {% set mins = (up / 60) | int %}
            <span class="m ell" style="flex:none">运行: {% if mins >= 1440 %}{{ '%d天%d小时' | format(mins // 1440, (mins % 1440) // 60) }}{% elif mins >= 60 %}{{ '%d小时%d分' | format(mins // 60, mins % 60) }}{% else %}{{ mins }}分钟{% endif %}</span>
          </div>

          <!-- 行2 y58 h49：SSID | IP（屏幕在外网时取不到 → 显示「公网 / 动态」而不是 unavailable） -->
          <div class="row g2">
            {% set ssid = states('sensor.ha_monitor_display_wifi_ssid') %}
            {% set ip = states('sensor.ha_monitor_display_ip_address') %}
            <div class="c" style="height:49px;gap:5px">
              <ha-icon icon="mdi:wifi" style="--mdc-icon-size:16px;color:#5AA9FF;flex:none"></ha-icon>
              <span class="m ell">SSID: {% if ssid not in ['unknown','unavailable','','None'] %}{{ ssid }}{% else %}公网{% endif %}</span>
            </div>
            <div class="c" style="height:49px;gap:5px">
              <ha-icon icon="mdi:web" style="--mdc-icon-size:16px;color:#FFD54F;flex:none"></ha-icon>
              <span class="m ell">IP: {% if ip not in ['unknown','unavailable','','None'] %}{{ ip }}{% else %}动态{% endif %}</span>
            </div>
          </div>

          <!-- 三列 y110 h153：设备信息 | 系统负载 | 网络参数 -->
          <div class="row g3">
            <div class="c col" style="height:153px">
              <div class="ttl"><ha-icon icon="mdi:chip" style="--mdc-icon-size:16px;color:#4FD8FA"></ha-icon><span>设备信息</span></div>
              <div class="hr"></div>
              <div class="ln"><ha-icon icon="mdi:server-network" style="--mdc-icon-size:16px;color:#FFB74D;flex:none"></ha-icon><span class="s ell">主机: 监视屏</span></div>
              <div class="ln"><ha-icon icon="mdi:cpu-64-bit" style="--mdc-icon-size:16px;color:#B39DFF;flex:none"></ha-icon><span class="s ell">芯片: ESP32-S3</span></div>
              <div class="ln"><ha-icon icon="mdi:monitor" style="--mdc-icon-size:16px;color:#59D98B;flex:none"></ha-icon><span class="s ell">屏幕: 480x320</span></div>
              <div class="ln"><ha-icon icon="mdi:web" style="--mdc-icon-size:16px;color:#5AA9FF;flex:none"></ha-icon><span class="s ell">固件: ESPHome</span></div>
            </div>
            <div class="c col" style="height:153px">
              <div class="ttl"><ha-icon icon="mdi:speedometer" style="--mdc-icon-size:16px;color:#4FD8FA"></ha-icon><span>系统负载</span></div>
              <div class="hr"></div>
              {% set heap = states('sensor.ha_monitor_display_free_heap') | float(0) %}
              <div class="ln"><ha-icon icon="mdi:memory" style="--mdc-icon-size:16px;color:#FFB74D;flex:none"></ha-icon><span class="s ell">内存: {% if heap > 0 %}{{ (heap / 1024) | round(0) | int }}K{% else %}<span style="color:#757575">--</span>{% endif %}</span></div>
              <div class="ln"><ha-icon icon="mdi:harddisk" style="--mdc-icon-size:16px;color:#B39DFF;flex:none"></ha-icon><span class="s ell">外存: <span style="color:#757575">--</span></span></div>
              {% set lp = states('sensor.ha_monitor_display_loop_time') | float(-1) %}
              <div class="ln"><ha-icon icon="mdi:restart" style="--mdc-icon-size:16px;color:#59D98B;flex:none"></ha-icon><span class="s ell">循环: {% if lp >= 0 %}{{ lp | round(0) | int }}ms{% else %}<span style="color:#757575">--</span>{% endif %}</span></div>
              {% set br = states('number.ha_monitor_display_screen_brightness') | float(-1) %}
              <div class="ln"><ha-icon icon="mdi:brightness-6" style="--mdc-icon-size:16px;color:#5AA9FF;flex:none"></ha-icon><span class="s ell">亮度: {% if br >= 0 %}{{ br | round(0) | int }}%{% else %}<span style="color:#757575">--</span>{% endif %}</span></div>
            </div>
            <div class="c col" style="height:153px">
              <div class="ttl"><ha-icon icon="mdi:wifi" style="--mdc-icon-size:16px;color:#4FD8FA"></ha-icon><span>网络参数</span></div>
              <div class="hr"></div>
              {% set r = states('sensor.ha_monitor_display_wifi_rssi') | float(-999) %}
              <div class="ln"><ha-icon icon="mdi:speedometer" style="--mdc-icon-size:16px;color:#FFB74D;flex:none"></ha-icon><span class="s ell">SIGQ: {% if r == -999 %}<span style="color:#757575">--</span>{% elif r > -55 %}<span style="color:#59D98B">优秀</span>{% elif r > -70 %}<span style="color:#FFD54F">良好</span>{% else %}<span style="color:#FF5252">微弱</span>{% endif %}</span></div>
              <div class="ln"><ha-icon icon="mdi:wifi-strength-2" style="--mdc-icon-size:16px;color:#B39DFF;flex:none"></ha-icon><span class="s ell">RSSI: {% if r == -999 %}<span style="color:#757575">--</span>{% else %}{{ r | round(0) | int }}dB{% endif %}</span></div>
              {% set lt = state_attr('automation.monitor_display_tui_song_shu_ju_dao_mqtt','last_triggered') %}
              {% set mq = lt is not none and (now() - lt).total_seconds() < 15 %}
              <div class="ln"><ha-icon icon="mdi:transit-connection-variant" style="--mdc-icon-size:16px;color:#59D98B;flex:none"></ha-icon><span class="s ell">MQTT: <span style="color:{{ '#59D98B' if mq else '#FF5252' }}">{{ '连通' if mq else '断开' }}</span></span></div>
              {% set ip = states('sensor.ha_monitor_display_ip_address') %}
              <div class="ln"><ha-icon icon="mdi:web" style="--mdc-icon-size:16px;color:#5AA9FF;flex:none"></ha-icon><span class="s ell">WiFi: {% if ip in ['unknown','unavailable',''] %}<span style="color:#757575">断开</span>{% else %}已连接{% endif %}</span></div>
            </div>
          </div>

          <div class="tab">
            <div class="ti">家居</div>
            <div class="ti">网络</div>
            <div class="ti on">系统</div>
            <div class="ti">通知</div>
          </div>
          <!-- 通知头 y5 h30：左 标题 | 中 当前时间 HH:MM | 右 相对时间 -->
          <div class="cq hd pgap" style="height:30px;gap:4px;justify-content:space-between">
            <div style="display:flex;align-items:center;gap:2px;flex:none">
              <ha-icon icon="mdi:bell" style="--mdc-icon-size:16px;color:#FFD54F;flex:none"></ha-icon>
              <span class="s ell">通知</span>
            </div>
            <div style="display:flex;align-items:center;gap:2px;flex:none">
              <ha-icon icon="mdi:clock-outline" style="--mdc-icon-size:14px;color:#FFD54F;flex:none"></ha-icon>
              <span class="s" style="color:#FFF">{{ now().strftime('%H:%M') }}</span>
            </div>
            <div style="display:flex;align-items:center;gap:2px;flex:none">
              {% set n = states('sensor.hmd_last_notify') %}
              {% set ts = state_attr('sensor.hmd_last_notify','ts') | int(0) %}
              {% set d = (now().timestamp() | int) - ts %}
              <span class="s ell" style="color:#FFF">{% if n in ['unknown','unavailable',''] %}--{% elif ts <= 0 or d < 60 %}刚刚{% elif d < 3600 %}{{ (d // 60) }} 分钟前{% elif d < 86400 %}{{ (d // 3600) }} 小时前{% else %}{{ (d // 86400) }} 天前{% endif %}</span>
            </div>
          </div>

          <!-- 通知体 y39 h187 -->
          <div class="cq" style="height:187px;align-items:flex-start;background:#2A2A2A">
            {% if n in ['unknown','unavailable',''] %}
            <div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#757575" class="m">暂无通知</div>
            {% else %}
            <div style="padding:10px 14px;width:100%;min-width:0">
              <div class="m" style="color:#4FD8FA;margin-bottom:6px">{{ state_attr('sensor.hmd_last_notify','title') or '' }}</div>
              {% set ns = namespace(m=(state_attr('sensor.hmd_last_notify','message') or n)) %}
              {% for k, v in NIM.items() %}{% set ns.m = ns.m | replace(k, v) %}{% endfor %}
              {% set ns.m = ns.m | regex_replace(find='#[0-9A-Fa-f]{6} ?[\uE000-\uF8FF\U000F0000-\U000FFFFD\u25CF]#', replace='', ignorecase=False) %}
              <div class="s" style="line-height:19px;color:#DDD;white-space:pre-wrap">{{ ns.m }}</div>
            </div>
            {% endif %}
          </div>

          <!-- 按键 y230 h32：上一条/下一条 白 · 删除 橙 · 全部删除 红 -->
          <div class="row g4">
            <div class="cq btn"><span class="s">‹ 上一条</span></div>
            <div class="cq btn"><span class="s">下一条 ›</span></div>
            <div class="cq btn"><span class="s" style="color:#FFB74D">删除</span></div>
            <div class="cq btn"><span class="s" style="color:#FF5252">全部删除</span></div>
          </div>
          <div class="tab">
            <div class="ti">家居</div>
            <div class="ti">网络</div>
            <div class="ti">系统</div>
            <div class="ti on">通知</div>
          </div>
          </div>

# 通知推送卡（暂时隐藏，需要时取消注释并把缩进恢复到 8 空格）
#- type: entities
#  title: 推送到屏幕
#  entities:
#    - entity: input_text.hmd_notify_text
#      name: 通知内容
#    - entity: input_boolean.hmd_notify_send
#      name: 立即推送到屏幕
