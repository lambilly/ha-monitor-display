# ==========================================================
# HA Monitor Display —— 通知桥接（屏幕通知 → HA 展示）
# ----------------------------------------------------------
# 安装位置：/config/packages/monitor_display_notify_bridge.yaml
#   （configuration.yaml 已有 packages: !include_dir_named packages）
#
# 作用：
#   订阅屏幕通知主题 home/ha-monitor-display/notify，
#   把「屏幕上正显示的那一条」暴露成 sensor.hmd_last_notify，
#   供 HA「屏幕镜像」看板的通知卡显示（镜像看板引用本传感器）。
#
#   ⚠️ 2026-11-25 移除原「手动发送」三件套：
#      automation "HMD: 发送通知到屏幕" + input_text.hmd_notify_text
#      + input_boolean.hmd_notify_send。
#      原因：全 HA 无任何看板/自动化/脚本/NR 引用这两个 input 实体，
#      且自动化"条件不满足不复位开关"有缺陷（开关卡 on 后永不触发，
#      最后触发停在 11-04）。实际通知入口 = NR 子流程「屏幕推送」
#      直接 publish 到 notify 主题，本包只做展示回读。
#
# payload 格式（与固件 on_message 解析一致）：
#   {"title": "门锁", "message": "前门已开启", "ts": 1793804000}
#   ts 单位秒（毫秒会自动除以 1000，但这里直接给秒）
# ==========================================================

mqtt:
  sensor:
    - name: "HMD Last Notify"
      unique_id: hmd_last_notify
      icon: mdi:bell-ring-outline
      state_topic: "home/ha-monitor-display/notify"
      # MQTT 传感器状态上限 255 字符，超长会刷 "Invalid state message"。
      # 通知正文带 LVGL 配色标记（#RRGGBB）且可能上千字，这里先剥掉配色标记、
      # 再截断到 250 字符；完整原文保留在属性 payload 里（属性无长度限制）。
      value_template: >-
        {%- set m = value_json.message if value_json is defined and value_json.message is defined else value -%}
        {%- set t = m | regex_replace('#[0-9A-Fa-f]{6} ?', '') | regex_replace('#', '') -%}
        {{ t[:250] }}{{ '…' if t | length > 250 else '' }}
      json_attributes_topic: "home/ha-monitor-display/notify"
      json_attributes_template: >-
        {{ {'title': value_json.title | default(''),
            'ts': value_json.ts | default(0),
            'payload': value} | tojson }}
      qos: 1
      device:
        identifiers: [ha_monitor_display_remote]
        name: "HA Monitor Remote"
