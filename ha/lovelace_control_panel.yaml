    - type: custom:html-template-card
      content: |-
        <div style="padding:10px 9px 8px"><div style="display:flex;align-items:baseline;gap:8px"><span style="font-size:14.5px;font-weight:600;line-height:17px;color:#FFB74D">家居</span></div></div>
