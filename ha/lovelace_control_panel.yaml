    card_mod:
      style: |-
        ha-card {
          padding: 0 !important;
        }
  - type: custom:stack-in-card
    mode: vertical
    cards:
    - type: custom:html-template-card
      content: |-
        <div style="padding:10px 9px 8px"><div style="display:flex;align-items:baseline;gap:8px"><span style="font-size:14.5px;font-weight:600;line-height:17px;color:#4FD8FA">今日头条</span></div></div>
      card_mod:
        style: |
          ha-card {
            padding: 0 !important;
            background: transparent !important;
            border: none !important;
            border-radius: 0 !important;
            box-shadow: none !important;
    - type: grid
      columns: 1
      square: false
      cards:
      - type: custom:html-template-card
        content: |-
          <div style="padding:2px 6px"><div style="font-size:12.5px;line-height:1.55;opacity:.8">{{ state_attr('sensor.gong_gong_xin_xi','fund').digest | replace('\n','<br>') }}<br>{{ state_attr('sensor.gong_gong_xin_xi','term').digest | replace('\n','<br>') }}<br>{{ state_attr('sensor.gong_gong_xin_xi','other').digest | replace('\n','<br>') }}</div></div>
        card_mod:
          style: |
            ha-card {
              padding: 0 !important;
              background: var(--ha-card-background, #1c1c1e) !important;
              border: 1px solid var(--divider-color, #2a2a2a) !important;
              border-radius: 12px !important;
              box-shadow: none !important;
    card_mod:
      style: |-
        ha-card {
          background: var(--ha-card-background, var(--card-background-color)) !important;
          border: 1px solid rgba(79,216,250,0.42) !important;
          border-left: 5px solid #4FD8FA !important;
          border-radius: 14px !important;
          overflow: hidden;
          box-shadow: 0 2px 10px rgba(0,0,0,.28) !important;
        }
  - type: custom:stack-in-card
    mode: vertical
