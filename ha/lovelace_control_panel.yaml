# 掌控 —— 手机优先的全屋操作台
# 与「概览」（桌面四栏全景）、「屏幕镜像」（墙屏 1:1 复刻）分工互补。
# 依赖：mushroom / stack-in-card / mini-graph-card / html-template-card / webrtc-camera（均已安装）
# 生成：python case/scripts/gen_control_panel.py —— 手改请同时改生成器

title: 掌控
views:
- title: 此刻
  path: now
  icon: mdi:home-clock-outline
