# ==========================================================
# HA Monitor Display —— 数据推送（HA → MQTT → ESP32 屏幕）
# ==========================================================
# 安装位置：/config/packages/monitor_display_push.yaml
# 启用方式：configuration.yaml 里要有
#   homeassistant:
#     packages: !include_dir_named packages
#
# 作用：
#   每 5 秒把这 52 个实体的当前值压成一个 JSON，publish 到
#   home/ha-monitor-display（retain=true），屏幕订阅这一个主题即可
#   在任何网络下（家里 / 公司 / 酒店）拿到全部数据。
#
# 为什么用 retain：
#   屏幕断电重启、或刚连上 broker 时，立刻能收到最后一帧数据，
#   不用干等 5 秒。也让"离线期间的数据"在重连后第一时间补上。
#
# 字段命名规则（与 ESP32 侧 global 一一对应，勿随意改动）：
#   数值    -> float（HA 里不可用时输出 null，屏幕端转成 NAN）
#   开关/在线 -> 1 / 0（不用 true/false，省流量且 ESP32 解析更简单）
#   文本    -> 原样字符串（null -> 空串）
# ==========================================================

automation:
  - id: monitor_display_push
    alias: "Monitor Display: 推送数据到 MQTT"
    description: >-
      把屏幕所需的 52 个实体打包成 JSON 发到 MQTT，
      供 ESP32 在任意网络（含外网）下读取
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: time_pattern
        seconds: "/5"
    actions:
      - action: mqtt.publish
        data:
          topic: home/ha-monitor-display
          retain: true
          qos: 1
          payload: >-
            {#- 开关类字段：先在 {% %} 里算成真正的数字，再放进字典。
                  · 实体不存在 / 不可用  -> none（JSON null，屏幕显示 "--"）
                  · on                   -> 1
                  · 其余（含 off）        -> 0
                注意：绝不能用 macro 在 {{ }} 表达式里返回值——Jinja 的
                macro 输出是"字符串"，会把 1 变成 "1"、null 变成 "null"，
                ESP32 侧 is<int>() 判定失败，字段全落空。 -#}
            {%- set ns = namespace(
                  nova13          = none,
                  nova12          = none,
                  wan_status      = none,
                  voice_broadcast = none,
                  fan_in_switch   = none,
                  fan_out_switch  = none,
                  stock_chg       = none) -%}
            {%- set ns.nova13          = none if states('binary_sensor.lam_nova13') in ['unknown', 'unavailable'] else (1 if is_state('binary_sensor.lam_nova13', 'on') else 0) -%}
            {%- set ns.nova12          = none if states('binary_sensor.su_nova12') in ['unknown', 'unavailable'] else (1 if is_state('binary_sensor.su_nova12', 'on') else 0) -%}
            {%- set ns.wan_status      = none if states('binary_sensor.tp_link_smb_tl_r498gpm_ac_wan_status') in ['unknown', 'unavailable'] else (1 if is_state('binary_sensor.tp_link_smb_tl_r498gpm_ac_wan_status', 'on') else 0) -%}
            {%- set ns.voice_broadcast = none if states('switch.voice_broadcast') in ['unknown', 'unavailable'] else (1 if is_state('switch.voice_broadcast', 'on') else 0) -%}
            {%- set ns.fan_in_switch   = none if states('switch.ruo_dian_xiang_feng_shan_sonoff_1002b4248d_1') in ['unknown', 'unavailable'] else (1 if is_state('switch.ruo_dian_xiang_feng_shan_sonoff_1002b4248d_1', 'on') else 0) -%}
            {%- set ns.fan_out_switch  = none if states('switch.ruo_dian_xiang_feng_shan_sonoff_1002b4248d_2') in ['unknown', 'unavailable'] else (1 if is_state('switch.ruo_dian_xiang_feng_shan_sonoff_1002b4248d_2', 'on') else 0) -%}
            {#- 上证涨跌幅：sensor.mei_ri_gu_zhi 的属性键是 sh000001（全小写），
                 里面 changeRatio 就是涨跌幅（涨为正、跌为负）。
                 兼容 Sh000001 写法；属性缺失/不是字典/没有该键 -> none（屏幕显灰）。 -#}
            {%- set stk = state_attr('sensor.mei_ri_gu_zhi', 'sh000001')
                          or state_attr('sensor.mei_ri_gu_zhi', 'Sh000001') -%}
            {%- set ns.stock_chg = stk.get('changeRatio') if stk is mapping and 'changeRatio' in stk else none -%}
            {#- 车辆距离（km）：车位状态卡片下方两行（轩逸黄 / 比亚迪粉）。
                注意：注释只能用这种花括号注释放在表达式外，
                表达式内部出现井号会直接语法报错。 -#}
            {{
              {
                "ts": now().timestamp() | int,

                "fan1_rpm":         states('sensor.fan_pwm_controller_fan_1_speed') | float(none),
                "fan2_rpm":         states('sensor.fan_pwm_controller_fan_2_speed') | float(none),
                "fan1_speed":       state_attr('fan.fan_pwm_controller_fan_1', 'percentage') | float(none),
                "fan2_speed":       state_attr('fan.fan_pwm_controller_fan_2', 'percentage') | float(none),
                "temp_front":       states('sensor.fan_pwm_controller_temperature') | float(none),
                "temp_back":        states('sensor.miaomiaoc_cn_blt_3_1f33gjhbc4k00_t2_temperature_p_2_1') | float(none),
                "temp_in":          states('sensor.miaomiaoc_cn_blt_3_1f308atcc4o01_t2_temperature_p_2_1') | float(none),
                "temp_out":         states('sensor.miaomiaoc_cn_blt_3_1fpsendsc4g01_t2_temperature_p_2_1') | float(none),

                "family_home":      states('sensor.family_home_count') | float(none),
                "guest_visit":      states('sensor.guest_visit_count') | float(none),
                "phone_online":     states('sensor.phone_online_count') | float(none),
                "server_count":     states('sensor.server_online_count') | float(none),
                "gateway_count":    states('sensor.gateway_online_count') | float(none),
                "ap_count":         states('sensor.ap_online_count') | float(none),
                "monitor_count":    states('sensor.device_monitor_count') | float(none),
                "light_on":         states('sensor.light_on_count') | float(none),
                "curtain_closed":   states('sensor.curtain_closed_count') | float(none),
                "climate_on":       states('sensor.climate_on_count') | float(none),
                "equipment_on":     states('sensor.equipment_on_count') | float(none),

                "weather_temp":     state_attr('weather.tian_qi', 'temperature') | float(none),
                "outdoor_temp":     states('sensor.outdoor_temperature') | float(none),
                "energy_today":     states('sensor.tasmota_energy_today') | float(none),
                "gas_today":        states('sensor.ri_yong_qi_liang') | float(none),
                "voltage":          states('sensor.tasmota_energy_voltage') | float(none),
                "water_pressure":   states('sensor.maze_wateronev3_tp_f8e644') | float(none),

                "xuanyi_dist":      states('sensor.wo_de_jia_xuan_yi_distance') | float(none),
                "byd_dist":         states('sensor.wo_de_jia_bi_ya_di_distance') | float(none),

                "wan_uptime":       states('sensor.tp_link_smb_tl_r498gpm_ac_uptime') | float(none),
                "asr_count":        states('sensor.asr_online_count') | float(none),
                "router_count":     states('sensor.router_online_count') | float(none),
                "device_ctrl":      states('sensor.device_control_count') | float(none),
                "terminal_count":   states('sensor.terminal_online_count') | float(none),
                "low_battery":      states('sensor.low_battery_count') | float(none),
                "nas_cpu":          states('sensor.lamnas_ws_cpu_utilization_total') | float(none),
                "nas_mem":          states('sensor.lamnas_ws_memory_usage_real') | float(none),
                "screen_bright":    state_attr('light.ha_monitor_display_screen_light', 'brightness') | float(none),
                "nas_download":     states('sensor.lamnas_ws_download_throughput') | float(none),
                "nas_upload":       states('sensor.lamnas_ws_upload_throughput') | float(none),

                "nova13":          ns.nova13,
                "nova12":          ns.nova12,
                "wan_status":      ns.wan_status,
                "voice_broadcast": ns.voice_broadcast,
                "fan_in_switch":   ns.fan_in_switch,
                "fan_out_switch":  ns.fan_out_switch,

                "time_text":       states('sensor.zhong_wen_shi_jian') | default('', true),
                "external_ip":     states('sensor.tp_link_smb_tl_r498gpm_ac_external_ip') | default('', true),
                "weather":         states('weather.tian_qi') | default('', true),
                "stock":           states('sensor.mei_ri_gu_zhi') | default('', true),
                "stock_chg":       ns.stock_chg,
                "home_mode":       states('sensor.ju_jia_mo_shi') | default('', true),
                "activity_log":    states('sensor.huo_dong_gui_ji') | default('', true),
                "parking_status":  states('sensor.parking_status') | default('', true)
              } | to_json
            }}
