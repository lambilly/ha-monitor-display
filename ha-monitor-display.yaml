select:
  # ----------------------------------------------------------
  # 每页卡片底色（HA 下拉选色，v1.1.0）
  #   只提供深色系：白字与橙紫绿蓝图标要在底色上读得清，
  #   固件侧另有每通道 0x50 上限钳制（防止以后误加速度更亮的选项）。
  #   选中即重绘（无需重启）；断电重启由 restore_value 恢复上次选择。
  #   缝隙色（四周边距/卡间）不单独暴露，由选色自动压暗到 50%。
  #   三档：石墨（默认，观感同改造前）/ 深空黑 / 深靛
  # ----------------------------------------------------------
  - platform: template
    id: sel_bg_dash
    name: "Dashboard Bg Color"
    icon: mdi:palette
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "石墨 1E1E1E"
    options:
      - "石墨 1E1E1E"
      - "深空黑 101012"
      - "深靛 241A48"
    on_value:
      - lambda: |-
          // 选项形如“深蓝 13223B”，取末尾 6 位十六进制即色值
          if (x.size() < 6) return;
          id(ui_bg_dash) = (uint32_t) strtoul(x.c_str() + x.size() - 6, nullptr, 16);
      - script.execute:
          id: ui_apply_bg
          page: 0

  - platform: template
    id: sel_bg_net
    name: "Network Bg Color"
    icon: mdi:palette
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "石墨 1E1E1E"
    options:
      - "石墨 1E1E1E"
      - "深空黑 101012"
      - "深靛 241A48"
    on_value:
      - lambda: |-
          if (x.size() < 6) return;
          id(ui_bg_net) = (uint32_t) strtoul(x.c_str() + x.size() - 6, nullptr, 16);
      - script.execute:
          id: ui_apply_bg
          page: 1

  - platform: template
    id: sel_bg_sys
    name: "System Bg Color"
    icon: mdi:palette
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "石墨 1E1E1E"
    options:
      - "石墨 1E1E1E"
      - "深空黑 101012"
      - "深靛 241A48"
    on_value:
      - lambda: |-
          if (x.size() < 6) return;
          id(ui_bg_sys) = (uint32_t) strtoul(x.c_str() + x.size() - 6, nullptr, 16);
      - script.execute:
          id: ui_apply_bg
          page: 2

switch:
  # 自动休眠总开关（关掉后常亮，适合调试/演示）
  - platform: template
    id: auto_sleep_switch
    name: "Auto Screen Sleep"
    icon: mdi:sleep
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    lambda: |-
      return id(ui_auto_sleep_enabled);
    turn_on_action:
      - lambda: id(ui_auto_sleep_enabled) = true;
    turn_off_action:
      - lambda: id(ui_auto_sleep_enabled) = false;
      # 关闭自动休眠时顺便点亮，避免停在黑屏状态
      - script.execute: wake_screen

script:
  # ----------------------------------------------------------
  # 应用页面背景配色（v1.1.0）
  #   卡片底色 = HA 下拉选定色；四周 5px 边距 + 卡间 3px 缝隙 = 选定色 × 0.5
  #   一轮用 0.6 倍 + 每通道 0x40 钳制，实测切换档位几乎看不出差别；
  #   二轮（10-31）参考 HA iOS 深色主题色阶重做：
  #     - 缝隙系数 0.6 → 0.5，拉开卡片与底色的边界对比
  #     - 钳制上限 0x40 → 0x50，色相通道不再被压低
  #     - 8 档色值整体提饱和（石墨沿用 1E1E1E，默认观感不变）
  #   三轮（10-31）色板试过壁纸取色的 7 色，最终定为 3 档：
  #     石墨 1E1E1E（默认）/ 深空黑 101012 / 深靛 241A48 —— 少而区分明显
  #   page: 0=家居  1=网络  2=系统
  # ----------------------------------------------------------
  - id: ui_apply_bg
    mode: restart
    parameters:
      page: int
    then:
      - lambda: |-
          if (!id(lvgl_ready)) return;

          // 注意：page 对象是 LvPageType*，底层 lv_obj_t* 在 ->obj 成员里
          lv_obj_t* scr = (page == 0) ? id(dashboard_page)->obj
                        : ((page == 1) ? id(network_page)->obj : id(system_page)->obj);
          if (scr == nullptr) return;

          uint32_t c = (page == 0) ? id(ui_bg_dash)
                     : ((page == 1) ? id(ui_bg_net) : id(ui_bg_sys));

          // 深色钳制（每通道 ≤ 0x50）：再亮白字在 12px 小字上会发灰
          uint32_t r = (c >> 16) & 0xFF;
          uint32_t g = (c >> 8) & 0xFF;
          uint32_t b = c & 0xFF;
          if (r > 0x50) r = 0x50;
          if (g > 0x50) g = 0x50;
          if (b > 0x50) b = 0x50;
          const uint32_t card = (r << 16) | (g << 8) | b;

          // 缝隙/边距：同色压暗到 50%（拉出卡片轮廓）
          const uint32_t gap = ((r * 5 / 10) << 16) | ((g * 5 / 10) << 8) | (b * 5 / 10);
          lv_obj_set_style_bg_color(scr, lv_color_hex(gap), 0);

          // 所有顶层容器（各卡片 + TAB 导航栏）统一底色；跳过 5px 以下的装饰线
          const uint32_t n = lv_obj_get_child_count(scr);
          for (uint32_t i = 0; i < n; i++) {
            lv_obj_t* ch = lv_obj_get_child(scr, i);
            if (ch == nullptr) continue;
            if (lv_obj_get_height(ch) <= 5) continue;
            lv_obj_set_style_bg_color(ch, lv_color_hex(card), 0);
          }

  # 熄屏：先记住当前亮度，再关背光
  - id: sleep_screen
    mode: single
    then:
      - lambda: |-
          float b = id(lcd_backlight).remote_values.get_brightness();
          if (b <= 0.01f) b = 1.0f;   // 已接近 0 时按满亮度恢复，防锁死
          id(ui_saved_brightness) = b;
          id(ui_screen_off) = true;
          ESP_LOGI("sleep", "screen off, saved brightness=%.2f", b);
      - light.turn_off: lcd_backlight

  # 唤醒：恢复熄屏前的亮度（不是写死 100%）
  - id: wake_screen
    mode: single
    then:
      - lambda: id(ui_screen_off) = false;
      - light.turn_on:
          id: lcd_backlight
          brightness: !lambda |-
            return id(ui_saved_brightness);
      - logger.log: "screen on"

# ==========================================================
# 开关类实体（MQTT 数据帧落地）
# ----------------------------------------------------------
# 说明：TemplateBinarySensor 的 loop() 每轮都会调用 lambda 并
# publish_state()，本身就会实时刷新，无需 update_interval
# （该选项在 binary_sensor.template 上并不存在）。
# 但 loop() 在 MQTT 首帧到达前就会发布初始值，所以这里加
# ha_data_last_ms == 0 守卫，避免开机瞬间把 "--" 误判成"关"。
# ==========================================================
binary_sensor:
  # nova13
  - platform: template
    id: ha_nova13
    internal: true
    lambda: |-
      // 三态：-1 表示 HA 侧实体不存在/无数据，此时不发布（保持 has_state=false）
      if (id(ha_data_last_ms) == 0 || id(hd_nova13) < 0) return {};
      return id(hd_nova13) != 0;
  # nova12
  - platform: template
    id: ha_nova12
    internal: true
    lambda: |-
      // 三态：-1 表示 HA 侧实体不存在/无数据，此时不发布（保持 has_state=false）
      if (id(ha_data_last_ms) == 0 || id(hd_nova12) < 0) return {};
