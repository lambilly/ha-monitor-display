#   行3：网络总览 | NAS状态 | 风扇运行   三列均分（标题 + 下划线 + 四行）
#   行4：TAB 导航（概览 | 网络 | 系统）
#
# 依赖 ui_common.yaml 里的字体与全局变量
# ==========================================================

