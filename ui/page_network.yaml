# ==========================================================
# 本页数据刷新
#   只在网络页可见时刷新（ui_current_page == 2）省 CPU
# ==========================================================
interval:
  - interval: 2s
    then:
      - lambda: |-
          if (!id(lvgl_ready)) return;
          if (id(ui_screen_off)) return;      // 熄屏时不再刷控件，省 CPU/SPI
          if (id(ui_current_page) != 2) return;

          char buf[64];

          // ===== 行1：外网 IP / 已连接时长 =====
          {
            std::string ip = id(net_external_ip).state;
            if (ip.empty()) snprintf(buf, sizeof(buf), "外网IP: --");
            else snprintf(buf, sizeof(buf), "外网IP: %s", ip.c_str());
            lv_label_set_text(id(net_ip_label), buf);
          }
          {
            // WAN 状态：在线绿 / 离线灰（与 IP 同色联动，一眼能看出是否通外网）
            const bool wan_up = id(net_wan_status).state;
            // 外网 IP 固定白色（不随在线状态变色），连接时长仍按状态变绿/灰
            lv_obj_set_style_text_color(id(net_uptime_label),
                                        lv_color_hex(wan_up ? 0x59D98B : 0x757575), 0);

            // 已连接时长：sensor.tp_link_smb_tl_r498gpm_ac_uptime（单位秒）
            float secs = id(net_wan_uptime).state;
            if (!wan_up) {
              lv_label_set_text(id(net_uptime_label), "已连接: 离线");
            } else if (!std::isfinite(secs) || secs < 0) {
              lv_label_set_text(id(net_uptime_label), "已连接: --");
            } else {
              // 单位自适应：<1小时显示分钟，<1天显示小时，否则 天+小时
              int total = (int) secs;
              if (total < 3600) {
                snprintf(buf, sizeof(buf), "已连接: %d分钟", total / 60);
              } else if (total < 86400) {
                snprintf(buf, sizeof(buf), "已连接: %d小时%d分", total / 3600, (total % 3600) / 60);
              } else {
                snprintf(buf, sizeof(buf), "已连接: %d天%d小时", total / 86400, (total % 86400) / 3600);
              }
              lv_label_set_text(id(net_uptime_label), buf);
            }
          }

          // ===== 行2：五列在线数（与概览页行2 同款格式）=====
          auto set_cnt = [](lv_obj_t* lbl, esphome::sensor::Sensor* s, const char* name) {
            char b[40];
            if (std::isfinite(s->state)) snprintf(b, sizeof(b), "%s:%d", name, (int)s->state);
            else snprintf(b, sizeof(b), "%s:--", name);
            lv_label_set_text(lbl, b);
          };
          set_cnt(id(net_server_label),  id(ha_server_count),  "主机");
          set_cnt(id(net_gateway_label), id(ha_gateway_count), "网关");
          set_cnt(id(net_ap_label),      id(ha_ap_count),      "无线");
          set_cnt(id(net_monitor_label), id(ha_monitor_count), "设备");
          set_cnt(id(net_asr_label),     id(ha_asr_count),     "语音");

          // ===== 行3 左列：网络总览 =====
          set_cnt(id(net_router_label),   id(ha_router_count),   "路由在线");
          set_cnt(id(net_ctrl_label),     id(ha_device_ctrl),    "控制设备");
          set_cnt(id(net_terminal_label), id(ha_terminal_count), "终端在线");

          // 低电量数：>0 时标红提示，=0 显示绿色
          {
            float v = id(ha_low_battery).state;
            if (std::isfinite(v)) {
              snprintf(buf, sizeof(buf), "低电量数: %d", (int) v);
              lv_label_set_text(id(net_battery_label), buf);
              lv_obj_set_style_text_color(id(net_battery_label),
                                          lv_color_hex(v > 0 ? 0xFF5252 : 0x59D98B), 0);
            } else {
              lv_label_set_text(id(net_battery_label), "低电量数: --");
            }
          }

          // ===== 行3 中列：NAS状态（CPU / 内存 / 上传 / 下载）=====
          // CPU / 内存：百分比，超阈值变色提示
          auto set_pct = [](lv_obj_t* lbl, esphome::sensor::Sensor* s, const char* name,
                            uint32_t warn, uint32_t danger) {
            char b[40];
            if (!std::isfinite(s->state)) {
              snprintf(b, sizeof(b), "%s:--", name);
              lv_label_set_text(lbl, b);
              lv_obj_set_style_text_color(lbl, lv_color_hex(0x757575), 0);
              return;
            }
            int v = (int) s->state;
            snprintf(b, sizeof(b), "%s: %d%%", name, v);
            lv_label_set_text(lbl, b);
            lv_obj_set_style_text_color(
                lbl, lv_color_hex(v >= (int) danger ? 0xFF5252 : (v >= (int) warn ? 0xFFD54F : 0x6FE3C4)), 0);
          };
          set_pct(id(net_nas_cpu_label), id(ha_nas_cpu), "CPU使用", 70, 90);
          set_pct(id(net_nas_mem_label), id(ha_nas_mem), "内存使用", 75, 92);

          // 网速（实体单位通常为 B/s，自适应 KB/s、MB/s）；上传/下载共用
          auto set_rate = [](lv_obj_t* lbl, esphome::sensor::Sensor* s, const char* name) {
            char b[40];
            float v = s->state;
            if (!std::isfinite(v) || v < 0) {
              snprintf(b, sizeof(b), "%s: --", name);
            } else if (v < 1024.0f) {
              snprintf(b, sizeof(b), "%s: %d B/s", name, (int) v);
            } else if (v < 1024.0f * 1024.0f) {
              snprintf(b, sizeof(b), "%s: %.1f KB/s", name, v / 1024.0f);
            } else {
              snprintf(b, sizeof(b), "%s: %.2f MB/s", name, v / 1048576.0f);
            }
            lv_label_set_text(lbl, b);
          };
          set_rate(id(net_nas_upload_label),   id(ha_nas_upload),   "上传速度");
          set_rate(id(net_nas_download_label), id(ha_nas_download), "下载速度");

          // ===== 行3 右列：风扇四路（转速 RPM + 状态着色）=====
          auto set_fan = [](lv_obj_t* lbl, esphome::sensor::Sensor* rpm_s,
                            esphome::sensor::Sensor* pct_s, const char* name) {
            char b[40];
            float rpm = rpm_s->state;
            float pct = pct_s->state;
            if (!std::isfinite(rpm)) {
              snprintf(b, sizeof(b), "%s:--", name);
              lv_label_set_text(lbl, b);
              lv_obj_set_style_text_color(lbl, lv_color_hex(0x757575), 0);
              return;
            }
            if (rpm < 1.0f) {
              snprintf(b, sizeof(b), "%s: 停", name);
              lv_label_set_text(lbl, b);
              lv_obj_set_style_text_color(lbl, lv_color_hex(0x757575), 0);
              return;
            }
            if (std::isfinite(pct)) snprintf(b, sizeof(b), "%s: %d%%", name, (int) pct);
            else snprintf(b, sizeof(b), "%s: %d转", name, (int) rpm);
            lv_label_set_text(lbl, b);
            // 转移速 60% 以上转橙色，表示高负载
            lv_obj_set_style_text_color(
                lbl, lv_color_hex((std::isfinite(pct) && pct >= 60.0f) ? 0xFFB74D : 0x59D98B), 0);
          };
          set_fan(id(net_fan_front_label), id(ha_fan1_rpm), id(ha_fan1_speed), "前扇");
          set_fan(id(net_fan_back_label),  id(ha_fan2_rpm), id(ha_fan2_speed), "后扇");
          // 进扇/出扇是 Sonoff 开关（switch 域），只表示开/关，没有转速；
          // 用 binary_sensor 平台读 switch 状态，开=绿，关=灰
          auto set_sw_fan = [](lv_obj_t* lbl, esphome::binary_sensor::BinarySensor* bs,
                               const char* name) {
            char b[40];
            snprintf(b, sizeof(b), "%s: %s", name, bs->state ? "开" : "关");
            lv_label_set_text(lbl, b);
            lv_obj_set_style_text_color(lbl, lv_color_hex(bs->state ? 0x59D98B : 0x757575), 0);
          };
          set_sw_fan(id(net_fan_in_label),  id(ha_fan_in_switch),  "进扇");
          set_sw_fan(id(net_fan_out_label), id(ha_fan_out_switch), "出扇");

          // 四路温度：紧跟风扇状态后面（温度计图标固定色，数值统一浅灰）
          auto set_temp = [](lv_obj_t* lbl, esphome::sensor::Sensor* s) {
            char b[24];
            if (!std::isfinite(s->state)) snprintf(b, sizeof(b), "--");
            else snprintf(b, sizeof(b), "%.0f℃", s->state);
            lv_label_set_text(lbl, b);
          };
          set_temp(id(net_temp_front_label), id(ha_temp_front));
          set_temp(id(net_temp_back_label),  id(ha_temp_back));
          set_temp(id(net_temp_in_label),    id(ha_temp_in));
          set_temp(id(net_temp_out_label),   id(ha_temp_out));
