# ==========================================================
# 页面 2：网络
#   行高与 page_dashboard.yaml 完全对齐：
#     行1 y5   h50  （与概览页行1 一致）
#     行2 y58  h49  （与概览页行2 一致，由 4 格改为 5 格均分）
#     行3 y110 h153 （剩余空间全部给第三行，三列均分）
#     行4 y266 h49  （与概览页末行一致）
#   间距统一 3px、圆角 5px、框内左内边距 5px
#
#   行1：外网 IP / 已连接时长（WAN）
