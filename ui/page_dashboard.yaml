# ==========================================================
# 页面 1：概览（默认首页）
#   6 个标准行，高度均分：320 - 上边距5 - 下边距5 - 5个间距×3 = 295
#   295 / 6 = 49 余 1 → 余数给首行：行1 高 50，其余 49
#   行1：中文时间 | 天气与温度 | 上证指数      （字号：small）
#   行2：服务器 / 网关 / AP / 设备 四格在线数   （字号：small）
#   行3：居家模式 | 车位状态                   （字号：medium）
#   行4：左列「电灯/窗帘」跨两行(101) | 中列「空调/电器」跨两行(101)
#        | 右列上下两个标准行：Nova13 / Nova12
#   行5：（左中列已跨行占用）右列下半，行4~行5 合成一个 101 高的视觉块
#   行6：TAB 导航（概览 | 网络 | 系统）         （字号：medium）
# 所有框间距 3px、圆角 5px；框内文字左内边距 5px、垂直居中
# 依赖 ui_common.yaml 里的字体与全局变量
# ==========================================================

lvgl:
  pages:
    - id: dashboard_page
      width: 480
      height: 320
      bg_color: 0x121212
      scrollable: false
      scrollbar_mode: "OFF"
      on_load:
        - lambda: id(ui_current_page) = 0;   # 概览页 = 默认首页
      widgets:
        # ============ 行1：时间 / 天气 / 上证指数 (y5 h50) ============
