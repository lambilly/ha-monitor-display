            border_width: 1
            outline_width: 0
            radius: 10
            scrollable: false
            widgets:
              - label:
                  id: home_time_label
                  align: left_mid
                  x: 3
                  text: "加载中..."
                  text_font: ui_font_medium
                  text_color: 0xE0E0E0
              - label:
                  align: left_mid
                  x: 203
                  text: "\U000F0595"
                  text_font: mdi_icons
                  text_color: 0x4FC3F7
              - label:
                  id: home_weather_label
                  align: left_mid
                  x: 221
                  text: "--"
                  text_font: ui_font_medium
                  text_color: 0x4FC3F7
              - label:
                  align: left_mid
                  x: 318
