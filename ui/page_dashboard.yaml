          // ===== 中列：今日能耗（用电 / 用气 / 电压 / 水压）=====
          // 数值未就绪时显示 "--"，单位随实体走
          auto fmt_val = [](char* out, size_t n, const char* name, float v, const char* unit, int prec) {
            if (!std::isfinite(v)) { snprintf(out, n, "%s: --", name); return; }
            char num[24];
            snprintf(num, sizeof(num), prec == 0 ? "%.0f" : (prec == 2 ? "%.2f" : "%.1f"), v);
            snprintf(out, n, "%s: %s%s", name, num, unit);
          };
