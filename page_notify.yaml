# ==========================================================
# 页面 4：通知列表（不进底部三键导航）
# ----------------------------------------------------------
# 入口：任意页面右上角铃铛图标（bell_icon，定义在主配置 top_layer）
# 返回：底部「返回」键 → 概览页
# 数据：MQTT home/ha-monitor-display/notify → 8 条环形缓冲
#       （订阅与写入见主配置 on_message，globals 在 ui_common.yaml）
# 布局：顶栏(标题+条数, y5 h30)
#       4 条通知槽(高 59，y = 39/100/161/222)
#       底栏返回键(y286 h29)
# 字体：标题/正文用 ui_font_notify（GB2312 常用字全量 12px，
#       通知文本任意字都能显示）；顶栏「通知」/「返回」用白名单字体
# 渲染：1s 巡检（本文件底部 interval），最新一条在最上
# ==========================================================

lvgl:
  pages:
    - id: notify_page
      width: 480
      height: 320
      bg_color: 0x121212
      scrollable: false
      scrollbar_mode: "OFF"
      on_load:
        - lambda: |-
            id(ui_current_page) = 4;      // 通知页 = 第 4 屏（0 概览/2 网络/3 系统，1 弃用）
            id(g_notify_unread) = 0;      // 进入即清除未读，铃铛回落灰色
      widgets:
        # ============ 顶栏：通知 | 共 N 条 (y5 h30) ============
        - obj:
            x: 5
            y: 5
            width: 470
            height: 30
            bg_color: 0x1E1E1E
            border_width: 1
            outline_width: 0
            radius: 10
            scrollable: false
            widgets:
              - label:
                  id: notify_title_label
                  align: left_mid
                  x: 10
                  text: "通知"
                  text_font: ui_font_medium
                  text_color: 0xE0E0E0
              - label:
                  id: notify_count_label
                  align: right_mid
                  x: -10
                  text: "共 0 条"
                  text_font: ui_font_small
                  text_color: 0x9E9E9E

        # ============ 通知槽 1（最新）y39 h59 ============
        - obj:
            x: 5
            y: 39
            width: 470
            height: 59
            bg_color: 0x1E1E1E
            border_width: 1
            outline_width: 0
            radius: 10
            scrollable: false
            widgets:
              - label:
                  id: notify_t1
                  align: TOP_LEFT
                  x: 10
                  y: 3
                  width: 330
                  long_mode: DOT
                  text: ""
                  text_font: ui_font_notify
                  text_color: 0xE0E0E0
              - label:
                  id: notify_time1
                  align: TOP_RIGHT
                  x: -10
                  y: 3
                  text: ""
                  text_font: ui_font_notify
                  text_color: 0x757575
              - label:
                  id: notify_m1
                  align: TOP_LEFT
                  x: 10
                  y: 22
                  width: 450
                  height: 36
                  text: ""
                  text_font: ui_font_notify
                  text_color: 0xBDBDBD

        # ============ 通知槽 2 y100 h59 ============
        - obj:
            x: 5
            y: 100
            width: 470
            height: 59
            bg_color: 0x1E1E1E
            border_width: 1
            outline_width: 0
            radius: 10
            scrollable: false
            widgets:
              - label:
                  id: notify_t2
                  align: TOP_LEFT
                  x: 10
                  y: 3
                  width: 330
                  long_mode: DOT
                  text: ""
                  text_font: ui_font_notify
                  text_color: 0xE0E0E0
              - label:
                  id: notify_time2
                  align: TOP_RIGHT
                  x: -10
                  y: 3
                  text: ""
                  text_font: ui_font_notify
                  text_color: 0x757575
              - label:
                  id: notify_m2
                  align: TOP_LEFT
                  x: 10
                  y: 22
                  width: 450
                  height: 36
                  text: ""
                  text_font: ui_font_notify
                  text_color: 0xBDBDBD

        # ============ 通知槽 3 y161 h59 ============
        - obj:
            x: 5
            y: 161
            width: 470
            height: 59
            bg_color: 0x1E1E1E
            border_width: 1
            outline_width: 0
            radius: 10
            scrollable: false
            widgets:
              - label:
                  id: notify_t3
                  align: TOP_LEFT
                  x: 10
                  y: 3
                  width: 330
                  long_mode: DOT
                  text: ""
                  text_font: ui_font_notify
                  text_color: 0xE0E0E0
              - label:
                  id: notify_time3
                  align: TOP_RIGHT
                  x: -10
                  y: 3
                  text: ""
                  text_font: ui_font_notify
                  text_color: 0x757575
              - label:
                  id: notify_m3
                  align: TOP_LEFT
                  x: 10
                  y: 22
                  width: 450
                  height: 36
                  text: ""
                  text_font: ui_font_notify
                  text_color: 0xBDBDBD

        # ============ 通知槽 4 y222 h59 ============
        - obj:
            x: 5
            y: 222
            width: 470
            height: 59
            bg_color: 0x1E1E1E
            border_width: 1
            outline_width: 0
            radius: 10
            scrollable: false
            widgets:
              - label:
                  id: notify_t4
                  align: TOP_LEFT
                  x: 10
                  y: 3
                  width: 330
                  long_mode: DOT
