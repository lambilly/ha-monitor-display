# ==========================================================
# 页面 4：通知（v2.0 NOTIFY）—— 单条全屏 + 上下切换
# ----------------------------------------------------------
# 入口：底部四键 TAB 的「通知」（四页共用同一套 TAB）
# 数据：MQTT home/ha-monitor-display/notify
#       → ns_notify 8 槽环形缓冲（ui/notify_store.h，单条正文上限 3.5KB）
# 版式（480x320）：
#   y5   h30  顶栏：左侧青色竖条 + 标题（12px 白，超长省略）｜右侧相对时间
#   y38  h188 正文：可滚动容器，内嵌一个 450px 宽 label（12px 白，自动换行）
#   y230 h32  切换条：‹ 上一条 ｜ 下一条 › ｜ 删除
#   y266 h49  四键 TAB
# 交互：上一条 = 往更旧翻（view+1），下一条 = 往更新翻（view-1），删除 = 删掉当前这条
# 刷新：只在 ns_notify::rev 变化时重绘；进页强制刷一次
# 字体：正文/标题/时间用 ui_font_notify（GB2312 一级 3755 字全量）
#       TAB 用白名单 ui_font_large（不为大字表多付三份体积）
# 配色：静态文字纯白；时间/次要 757575；青色只留给 TAB 当前页与标题竖条
#       卡片底色由 ui_apply_bg(page: 3) 涂，与家居页共用 ui_bg_dash
# ==========================================================

lvgl:
  pages:
    - id: notify_page
      width: 480
      height: 320
      bg_color: 0x1E1E1E
      scrollable: false
      scrollbar_mode: "OFF"
      on_load:
        - lambda: |-
            id(ui_current_page) = 4;   // 0 家居 / 2 网络 / 3 系统 / 4 通知（1 弃用）
            ns_notify::unread = 0;     // 进页即清未读
        - script.execute: notify_render
        # 底色跟随家居页（page: 3 = 通知页）
        - script.execute:
            id: ui_apply_bg
            page: 3
      widgets:
        # ============ 顶栏：标题 ｜ 相对时间 (y5 h30) ============
        - obj:
            x: 5
            y: 5
            width: 470
            height: 30
            bg_color: 0x1E1E1E
            border_width: 1
            outline_width: 0
            radius: 10
            scrollable: false
            widgets:
              # 青色竖条：标题标识（v1.1 起青色专用于「当前/标题」）
              - obj:
                  align: left_mid
                  x: 9
                  width: 3
                  height: 14
                  bg_color: 0x4FD8FA
                  border_width: 0
                  outline_width: 0
                  radius: 2
                  scrollable: false
              - label:
                  id: notify_title
                  align: left_mid
                  x: 18
                  width: 320
                  long_mode: DOT
                  recolor: true
                  text: "通知"
                  text_font: ui_font_notify
                  text_color: 0xFFFFFF
              - label:
                  id: notify_time_rel
                  align: right_mid
                  x: -10
                  text: ""
                  text_font: ui_font_notify
                  text_color: 0x757575

        # ============ 正文：可滚动 (y38 h188) ============
        - obj:
            id: notify_body_obj
            x: 5
            y: 38
            width: 470
            height: 188
            bg_color: 0x1E1E1E
            border_width: 1
            outline_width: 0
            radius: 10
            scrollable: true
            scrollbar_mode: "OFF"
            widgets:
              - label:
                  id: notify_body
                  x: 10
                  y: 8
                  width: 448
                  long_mode: WRAP
                  recolor: true
                  text: ""
                  text_font: ui_font_notify
                  text_color: 0xFFFFFF

        # ============ 空态（无通知时） ============
        - label:
            id: notify_empty_label
            align: center
            x: 0
            y: -30
            text: "暂无通知"
            text_font: ui_font_medium
            text_color: 0x757575

        # ============ 切换条 (y230 h32) ============
        - obj:
            id: notify_switch_bar
            x: 5
            y: 230
            width: 470
            height: 32
            bg_color: 0x1E1E1E
            border_width: 1
            outline_width: 0
            radius: 10
            scrollable: false
            widgets:
              - label:
                  align: left_mid
                  x: 20
                  width: 140
                  text: "‹ 上一条"
                  text_align: CENTER
                  text_font: ui_font_notify
                  text_color: 0xFFFFFF
                  on_click:
                    - lambda: |-
                        if (ns_notify::view < ns_notify::count - 1) ns_notify::view++;
                        id(notify_render).execute();
              - label:
                  align: center
                  x: 0
                  width: 140
                  text: "下一条 ›"
                  text_align: CENTER
                  text_font: ui_font_notify
                  text_color: 0xFFFFFF
                  on_click:
                    - lambda: |-
                        if (ns_notify::view > 0) ns_notify::view--;
                        id(notify_render).execute();
              - label:
                  align: right_mid
                  x: -20
                  width: 100
                  text: "删除"
                  text_align: CENTER
                  text_font: ui_font_notify
                  text_color: 0xFF5252
                  on_click:
                    - lambda: |-
                        ns_notify::remove_at(ns_notify::view);
                        id(notify_render).execute();

        # ============ 底部四键 TAB（四页共用，见 ui/tab_bar.yaml） ============
        - !include ui/tab_bar.yaml

# --- 渲染脚本（进页 / 切换 / 删除 / 有新消息时调用） ---
script:
  - id: notify_render
    mode: restart
    then:
      - lambda: |-
          const int n = ns_notify::count;

          // 浏览位置纠偏：删到空、或条数变少时回到有效范围
          if (ns_notify::view > n - 1) ns_notify::view = (n > 0) ? n - 1 : 0;
          if (n == 0) {
            lv_obj_add_flag(id(notify_body_obj), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(notify_switch_bar), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(notify_empty_label), LV_OBJ_FLAG_HIDDEN);
            lv_label_set_text(id(notify_title), "通知");
            lv_label_set_text(id(notify_time_rel), "");
            lv_label_set_text(id(notify_body), "");
            return;
          }
          lv_obj_clear_flag(id(notify_body_obj), LV_OBJ_FLAG_HIDDEN);
          lv_obj_clear_flag(id(notify_switch_bar), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(notify_empty_label), LV_OBJ_FLAG_HIDDEN);

          const ns_notify::Slot &s = ns_notify::at(ns_notify::view);
          lv_label_set_text(id(notify_title), s.title.c_str());
          lv_label_set_text(id(notify_body), s.msg.c_str());

          // 相对时间：比绝对时间省字符，也更像通知中心的观感
          char tb[24] = {0};
          const uint32_t now = static_cast<uint32_t>(::time(nullptr));
          if (s.ts > 0 && now > s.ts) {
            const uint32_t d = now - s.ts;
            if (d < 60)             snprintf(tb, sizeof(tb), "刚刚");
            else if (d < 3600)      snprintf(tb, sizeof(tb), "%u 分钟前", (unsigned) (d / 60));
            else if (d < 86400)     snprintf(tb, sizeof(tb), "%u 小时前", (unsigned) (d / 3600));
            else                    snprintf(tb, sizeof(tb), "%u 天前", (unsigned) (d / 86400));
          }
          lv_label_set_text(id(notify_time_rel), tb);

          // 阅读即已读：停在最新一条时清未读
          if (ns_notify::view == 0) ns_notify::unread = 0;

          ESP_LOGD("notify", "重绘 view=%d/%d rev=%u", ns_notify::view, n, (unsigned) ns_notify::rev);

# --- 内容变化时才触发重绘（1s 巡检，无新消息直接 return） ---
interval:
  - interval: 1s
    then:
      - lambda: |-
          if (!id(lvgl_ready)) return;
          if (id(ui_screen_off)) return;
          if (id(ui_current_page) != 4) return;
          static uint32_t last_rev = 0;
          if (ns_notify::rev == last_rev) return;
          last_rev = ns_notify::rev;
          id(notify_render).execute();
