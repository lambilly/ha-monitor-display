# ==========================================================
# 页面 4：通知（v2.0 NOTIFY）—— 单条全屏 + 上下切换
# ----------------------------------------------------------
# 入口：底部四键 TAB 的「通知」（四页共用同一套 TAB）
# 数据：MQTT home/ha-monitor-display/notify
#       → ns_notify 8 槽环形缓冲（ui/notify_store.h，单条正文上限 3.5KB）
# 版式（480x320）—— 顶栏回到 30 高（12px 标题撑不起 50 高，显得空），省下的
#   高度全给正文，卡片纵向节奏 5/30 · 4 · 187 · 4 · 32 · 4 · 49
#   y5   h30  顶栏：MDI 铃铛（4FD8FA）+ 标题（12px 白）｜右侧时间（12px 白，带 4 位年份）
#   y39  h187 正文：仅纵向滚动容器，内嵌 450px 宽 label（12px 白，折行在入库时切好）
#   y230 h32  切换条：四个等宽按钮，列间 10px
#   y266 h49  四键 TAB
# 交互：上一条 = 往更旧翻（view+1），下一条 = 往更新翻（view-1）
#       删除 = 删当前这条；全部删除 = 清空 8 槽
#       内容超一屏时自动慢速下滚（10px/s），到底停 3 秒回到顶部；手一碰就暂停 4 秒
# 刷新：只在 ns_notify::rev 变化时重绘；进页强制刷一次
# 字体：正文/标题/按钮/时间统一 ui_font_notify（12px，GB2312 一级 3755 字全量）
#       TAB 用白名单 ui_font_large（不为大字表多付三份体积）
# 折行：不依赖 LVGL 的 WRAP（它的行宽会被文本重算覆盖，两轮都没稳住），
#       改由 notify_store.h 的 wrap_hard() 在入库时按 420px 硬切行；
#       Node-RED 侧也做了同样的折行，两头双保险。
# 配色：静态文字纯白；灰色 757575 只留给空态/占位；青色只留给 TAB 当前页与标题图标；
#       按钮底 2A2A2A；删除橙 FFB74D、全部删除红 FF5252（只有文字变色）
# ==========================================================

lvgl:
  pages:
    - id: notify_page
      width: 480
      height: 320
      bg_color: 0x1E1E1E
      scrollable: false
      scrollbar_mode: "OFF"
      on_load:
        - lambda: |-
            id(ui_current_page) = 4;   // 0 家居 / 2 网络 / 3 系统 / 4 通知（1 弃用）
            ns_notify::unread = 0;     // 进页即清未读

            // 正文容器只允许纵向滚动（用户反馈原来会左右滑）：
            //   scroll_dir 收窄成 LV_DIR_VER；宽度与 long_mode 在每次渲染里
            //   set_text 之后重设（见 notify_render），这里只兜第一次进页。
            lv_obj_set_scroll_dir(id(notify_body_obj), LV_DIR_VER);
            lv_obj_set_width(id(notify_body), 450);
            lv_label_set_long_mode(id(notify_body), LV_LABEL_LONG_WRAP);
            lv_obj_scroll_to_y(id(notify_body_obj), 0, LV_ANIM_OFF);
        - script.execute: notify_render
        # 底色跟随家居页（page: 3 = 通知页）
        - script.execute:
            id: ui_apply_bg
            page: 3
      widgets:
        # ============ 顶栏：铃铛 + 标题 ｜ 时间 (y5 h30) ============
        - obj:
            x: 5
            y: 5
            width: 470
            height: 30
            bg_color: 0x1E1E1E
            border_width: 1
            outline_width: 0
            radius: 10
            scrollable: false
            widgets:
              # 固定 MDI 铃铛：mdicons.mdi-bell（U+F009A），青色＝标题标识色
              - label:
                  align: left_mid
                  x: 1
                  text: "\U000F009A"
                  text_font: mdi_icons_20
                  height: 18
                  text_color: 0x4FD8FA
              - label:
                  id: notify_title
                  align: left_mid
                  x: 23
                  width: 320
                  long_mode: DOT
                  recolor: true
                  text: "通知"
                  text_font: ui_font_notify
                  text_color: 0xFFFFFF
              # 时间：白字、固定左起点（label 宽度随文本走，右对齐不可靠）
              #   格式 2026-11-01 18:07 —— 4 位年份 + 月日 + 时分，16 字符 ≈ 99px
              #   344 + 99 = 443，卡片右侧仍留 27px；标题上限 24 字（288px）到 311，
              #   中间 33px 空隙，长标题也压不到时间。
              - label:
                  id: notify_time_rel
                  align: left_mid
                  x: 344
                  text: ""
                  text_font: ui_font_notify
                  text_color: 0xFFFFFF

        # ============ 正文：仅纵向滚动 (y39 h187) ============
        - obj:
            id: notify_body_obj
            x: 5
            y: 39
            width: 470
            height: 187
            bg_color: 0x1E1E1E
            border_width: 1
            outline_width: 0
            radius: 10
            scrollable: true
            scrollbar_mode: "OFF"
            widgets:
              # 正文：左右各留 10px（470 - 10 - 450 = 10，两边等距）
              #   行在入库时按 420px 切好，正文可用 450 → 右侧天然留 30px。
              #   text_align LEFT：默认居中会让短行看起来偏，通知应左对齐。
              - label:
                  id: notify_body
                  x: 10
                  y: 8
                  width: 450
                  long_mode: WRAP
                  text_align: LEFT
                  recolor: true
                  text: ""
                  text_font: ui_font_notify
                  text_color: 0xFFFFFF

        # ============ 空态（无通知时） ============
        - label:
            id: notify_empty_label
            align: center
            x: 0
            y: -10
            text: "暂无通知"
            text_font: ui_font_medium
            text_color: 0x757575

        # ============ 切换条 (y230 h32)：四个等宽按钮，列间 10px ============
        #   470 内容宽，左右各 10 内边距 → 450 可分；4 块 + 3×10 间隙
        #   → 每块 105，位置 10 / 125 / 240 / 355（355+105 = 460，右边距 10，对称）
        - obj:
            id: notify_switch_bar
            x: 5
            y: 230
            width: 470
            height: 32
            bg_color: 0x1E1E1E
            border_width: 1
            outline_width: 0
            radius: 10
            scrollable: false
            widgets:
              # 上一条（往更旧翻）
              - obj:
                  align: left_mid
                  x: 10
                  width: 105
                  height: 24
                  bg_color: 0x2A2A2A
                  border_width: 0
                  outline_width: 0
                  radius: 6
                  scrollable: false
                  widgets:
                    - label:
                        align: center
                        text: "‹ 上一条"
                        text_font: ui_font_notify
                        text_color: 0xFFFFFF
                  on_click:
                    - lambda: |-
                        if (ns_notify::view < ns_notify::count - 1) ns_notify::view++;
                        id(notify_render).execute();
              # 下一条（往更新翻）
              - obj:
                  align: left_mid
                  x: 125
                  width: 105
                  height: 24
                  bg_color: 0x2A2A2A
                  border_width: 0
                  outline_width: 0
                  radius: 6
                  scrollable: false
                  widgets:
                    - label:
                        align: center
                        text: "下一条 ›"
                        text_font: ui_font_notify
                        text_color: 0xFFFFFF
                  on_click:
                    - lambda: |-
                        if (ns_notify::view > 0) ns_notify::view--;
                        id(notify_render).execute();
              # 删除当前条：橙 FFB74D（只删一条，误触代价小）
              - obj:
                  align: left_mid
                  x: 240
                  width: 105
                  height: 24
                  bg_color: 0x2A2A2A
                  border_width: 0
                  outline_width: 0
                  radius: 6
                  scrollable: false
                  widgets:
                    - label:
                        align: center
                        text: "删除"
                        text_font: ui_font_notify
                        text_color: 0xFFB74D
                  on_click:
                    - lambda: |-
                        ns_notify::remove_at(ns_notify::view);
                        id(notify_render).execute();
              # 全部删除：红 FF5252（一次清空 8 槽，不可撤销，放最右最不易误触）
              - obj:
                  align: left_mid
                  x: 355
                  width: 105
                  height: 24
                  bg_color: 0x2A2A2A
                  border_width: 0
                  outline_width: 0
                  radius: 6
                  scrollable: false
                  widgets:
                    - label:
                        align: center
                        text: "全部删除"
                        text_font: ui_font_notify
                        text_color: 0xFF5252
                  on_click:
                    - lambda: |-
                        ns_notify::clear_all();
                        id(notify_render).execute();

        # ============ 底部四键 TAB（四页共用，见 ui/tab_bar.yaml） ============
        - !include tab_bar.yaml

# --- 渲染脚本（进页 / 切换 / 删除 / 有新消息时调用） ---
script:
  - id: notify_render
    mode: restart
    then:
      - lambda: |-
          const int n = ns_notify::count;

          // 浏览位置纠偏：删到空、或条数变少时回到有效范围
          if (ns_notify::view > n - 1) ns_notify::view = (n > 0) ? n - 1 : 0;
          if (n == 0) {
            lv_obj_add_flag(id(notify_body_obj), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(notify_switch_bar), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(notify_empty_label), LV_OBJ_FLAG_HIDDEN);
            lv_label_set_text(id(notify_title), "通知");
            lv_label_set_text(id(notify_time_rel), "");
            lv_label_set_text(id(notify_body), "");
            return;
          }
          lv_obj_clear_flag(id(notify_body_obj), LV_OBJ_FLAG_HIDDEN);
          lv_obj_clear_flag(id(notify_switch_bar), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(notify_empty_label), LV_OBJ_FLAG_HIDDEN);

          const ns_notify::Slot &s = ns_notify::at(ns_notify::view);
          lv_label_set_text(id(notify_title), s.title.c_str());
          lv_label_set_text(id(notify_body), s.msg.c_str());

          // 宽度/long_mode 每次 set_text 后重设一次（兜底）：
          //   LVGL 会在设文本时重算尺寸，即使 YAML 里写了 width: 450，
          //   运行期仍可能退回内容宽。不过现在真正的折行由 notify_store.h
          //   的 wrap_hard() 在入库时用真换行符切好，这里只保证滚动容器
          //   不会横向跑偏。set_text 之后再调，顺序不能反。
          lv_obj_set_width(id(notify_body), 450);
          lv_label_set_long_mode(id(notify_body), LV_LABEL_LONG_WRAP);
          lv_obj_update_layout(id(notify_body));   // 立刻算出折行后的高度

          // 换内容 / 切条后回到顶部（自动滚动从第一行开始）
          lv_obj_scroll_to_y(id(notify_body_obj), 0, LV_ANIM_OFF);

          // 时间：绝对时间 2026-11-01 18:07（用户 11-01 要求带 4 位年份）
          //   兜底链：
          //     1) ts 缺失（上游没带）→ 用设备当前时间；
          //     2) 设备时钟没走（now < 2020）→ 显示「刚刚」，绝不留空白。
          //   ts 单位在主配置 on_message 里已归一成秒。
          char tb[24] = {0};
          const uint32_t now = static_cast<uint32_t>(::time(nullptr));
          const uint32_t ts = (s.ts != 0) ? s.ts : now;
          if (ts > 1600000000UL) {                      // 2020 之后才认为是有效时间戳
            const time_t t = static_cast<time_t>(ts);
            struct tm v;
            localtime_r(&t, &v);
            snprintf(tb, sizeof(tb), "%d-%02d-%02d %02d:%02d",
                     v.tm_year + 1900, v.tm_mon + 1, v.tm_mday, v.tm_hour, v.tm_min);
          } else {
            snprintf(tb, sizeof(tb), "刚刚");
          }
          lv_label_set_text(id(notify_time_rel), tb);

          // 阅读即已读：停在最新一条时清未读
          if (ns_notify::view == 0) ns_notify::unread = 0;

          ESP_LOGD("notify", "重绘 view=%d/%d rev=%u", ns_notify::view, n, (unsigned) ns_notify::rev);

# --- 内容变化时才触发重绘（1s 巡检，无新消息直接 return） ---
interval:
  - interval: 1s
    then:
      - lambda: |-
          if (!id(lvgl_ready)) return;
          if (id(ui_screen_off)) return;
          if (id(ui_current_page) != 4) return;
          static uint32_t last_rev = 0;
          if (ns_notify::rev == last_rev) return;
          last_rev = ns_notify::rev;
          id(notify_render).execute();

  # --- 长文自动上下滚动（400ms 一步、每步 4px ≈ 10px/s） ---
  #   只在：通知页 + 屏幕亮 + 有内容 + 内容超一屏 时才动
  #   为什么不是 100ms/1px：每一步都要让 LVGL 重画整块正文区（470×187），
  #   10fps 会明显吃 SPI 带宽、拖动也会发涩；400ms 一步约 2.5fps，观感一样顺。
  #   用户刚摸过屏幕（4s 内）：暂停，避免跟手指抢
  #   滚到底：停 3 秒，再动画回到顶部，循环
  - interval: 400ms
    then:
      - lambda: |-
          if (!id(lvgl_ready)) return;
          if (id(ui_screen_off)) return;
          if (id(ui_current_page) != 4) return;

          lv_obj_t *box = id(notify_body_obj);
          lv_obj_t *lb  = id(notify_body);
          if (box == nullptr || lb == nullptr) return;
          if (lv_obj_has_flag(box, LV_OBJ_FLAG_HIDDEN)) return;

          static uint32_t seen_rev = 0;
          static uint32_t bottom_at = 0;     // 停在底部的起始时刻
          static uint32_t hold_until = 0;    // 顶部停留截止时刻

          // 来了新通知 / 换了条目：回到顶部并先停 3 秒，让人从头读
          if (ns_notify::rev != seen_rev) {
            seen_rev = ns_notify::rev;
            bottom_at = 0;
            hold_until = millis() + 3000;
          }

          // 内容不超过一屏（上下各 8px 内边距）就不用滚
          if (lv_obj_get_height(lb) + 16 <= lv_obj_get_height(box)) return;

          // 手指刚动过：暂停，别跟人抢
          if (lv_disp_get_inactive_time(NULL) < 4000) {
            bottom_at = 0;
            return;
          }
          if (millis() < hold_until) return;

          if (lv_obj_get_scroll_bottom(box) > 0) {
            bottom_at = 0;
            lv_obj_scroll_by(box, 0, -4, LV_ANIM_OFF);
          } else if (bottom_at == 0) {
            bottom_at = millis();
          } else if (millis() - bottom_at > 3000) {
            // 用 LV_ANIM_OFF 直接跳回顶部：带动画会和下一拍的 -4px 抢方向
            lv_obj_scroll_to_y(box, 0, LV_ANIM_OFF);
            bottom_at = 0;
            hold_until = millis() + 2000;
          }
