        # 空态提示（无通知时显示，居中偏上）
        - label:
            id: notify_empty_label
            align: center
            x: 0
            y: -40
            text: "暂无通知"
            text_font: ui_font_medium
            text_color: 0x616161

        # ============ 底栏：返回键 (y286 h29) ============
        - obj:
            x: 5
            y: 286
            width: 470
            height: 29
            bg_color: 0x1E1E1E
            border_width: 1
            outline_width: 1
            radius: 10
            scrollable: false
            widgets:
              - label:
                  id: nav_notify_back
                  align: center
                  x: 0
                  width: 470
                  text: "返回"
                  text_align: CENTER
                  text_font: ui_font_medium
                  text_color: 0x4FD8FA
                  on_click:
                    - lvgl.page.show: dashboard_page

# --- 本页数据刷新（1s） ---
interval:
  - interval: 1s
    then:
      - lambda: |-
          if (!id(lvgl_ready)) return;
          if (id(ui_screen_off)) return;
          if (id(ui_current_page) != 4) return;

          const int n    = id(g_notify_count);
          const int head = id(g_notify_head);

          // 顶栏条数 + 空态提示（只在数量变化时刷新）
          static int last_n = -1;
          if (n != last_n) {
            last_n = n;
            char cb[24];
            snprintf(cb, sizeof(cb), "共 %d 条", n);
            lv_label_set_text(id(notify_count_label), cb);
            if (n == 0) lv_obj_clear_flag(id(notify_empty_label), LV_OBJ_FLAG_HIDDEN);
            else        lv_obj_add_flag(id(notify_empty_label), LV_OBJ_FLAG_HIDDEN);
          }

          lv_obj_t *titles[4] = {id(notify_t1), id(notify_t2), id(notify_t3), id(notify_t4)};
          lv_obj_t *times[4]  = {id(notify_time1), id(notify_time2), id(notify_time3), id(notify_time4)};
          lv_obj_t *msgs[4]   = {id(notify_m1), id(notify_m2), id(notify_m3), id(notify_m4)};

          for (int i = 0; i < 4; i++) {
            if (i < n) {
              const int idx = ((head - 1 - i) % 8 + 8) % 8;   // newest-first，保证非负
              lv_label_set_text(titles[i], id(g_notify_title)[idx].c_str());
              // 时间戳：Unix 秒 → "MM-DD HH:MM"（本地时区，SNTP 已配 Asia/Shanghai）
              char tbuf[24] = {0};
              if (id(g_notify_ts)[idx] > 0) {
                esphome::ESPTime tv = esphome::ESPTime::from_epoch_local(id(g_notify_ts)[idx]);
                tv.strftime(tbuf, sizeof(tbuf), "%m-%d %H:%M");
              }
              lv_label_set_text(times[i], tbuf);
              lv_label_set_text(msgs[i], id(g_notify_msg)[idx].c_str());
            } else {
              lv_label_set_text(titles[i], "");
              lv_label_set_text(times[i], "");
              lv_label_set_text(msgs[i], "");
            }
          }
